[workspace]
resolver = "3"
members = ["crates/engine", "crates/cli"]
# Probe executables live OUTSIDE the workspace (module-layout.md → Probe boundary):
# any language, their own deps (tree-sitter from T2) kept out of the engine/cli lock.
# The dev pack's `doc-code` probe is built on demand by its fixture test, never a member.
exclude = ["crates/cli/probes/doc-code"]

[workspace.package]
version = "1.0.0-rc.19"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gherrink/jigc"
publish = false

# The one `Finding` envelope is the engine's error type, returned by value through
# many `Result<_, Finding>` signatures (the "one finding shape" contract,
# `finding.rs`). M6 grew `Finding` with the structured `(probe, check)` severity
# handle, tipping it past clippy's `result_large_err` 128-byte threshold; boxing
# every propagation site would be cross-cutting churn that fights the by-value
# envelope design, so the lint is allowed workspace-wide.
[workspace.lints.clippy]
result_large_err = "allow"

# Full debug info on a workspace whose test surface links the whole of `cli` + `engine`
# into every test binary cost 6.3 GB of `target/debug/deps` and dominated link time.
# `line-tables-only` keeps what this repo actually reads — the file:line of a panic in a
# test backtrace — and drops the type/variable tables only an interactive debugger uses.
#
# `packed` runs `dsymutil` per binary — one `.dSYM` bundle beside it — instead of
# `unpacked`, which leaves the debug sections in the `*.rcgu.o` object files. The
# *cost* of `unpacked` was the argument for it and is now the argument against it:
# cargo never garbage-collects those sidecars, and on 2026-09-14 `target/debug/deps`
# held 1,825,219 entries (26 GB), 1,823,960 of them `*.rcgu.o`, median age 15 days,
# because every gate run re-links the `cli` test binaries under a fresh hash and adds
# thousands more. macOS `syspolicyd` (Gatekeeper) then rescans the tree: a full
# `dev/gate` measured ~20 min, and ~9.5 min on the same tree with the stale sidecars
# deleted mid-run (clippy 148→13 s, build 200→9 s, test 958→~540 s). One bundle per
# binary that nothing reads is cheaper than hundreds of loose objects per link that
# nothing reads. `[profile.test]` inherits from `dev`, so the test binaries — which
# produce essentially all of the litter — are covered by this one setting. Measured
# after the switch: a full `cargo test` build leaves 224 entries in
# `target/debug/deps` (15 `.dSYM` bundles, zero `*.rcgu.o`) against 529,616 before it.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

# Load-bearing crates (language-runtime.md). Declared centrally; each member
# opts in per-increment with `<crate>.workspace = true` when it actually needs them.
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
pulldown-cmark = "0.13"
include_dir = "0.7"
thiserror = "2"
anyhow = "1"
blake3 = "1"
# Raw `dup`/`dup2`/`pipe` for the invocation-log fd-level output-size tee (`main.rs`).
# Unix-only, matching jigc's target (DECISIONS 2026-07-06 fork F).
libc = "0.2"
engine = { path = "crates/engine" }

# Dev-dependencies (test tooling, language-runtime.md / parsing.md round-trip contract).
[workspace.dependencies.insta]
version = "1"

[workspace.dependencies.proptest]
version = "1"
