title: "Use the ADR number as its unique ID"
sections:
  - id: status
    set:
      status: superseded
      date: "2020-09-26"
  - id: context
    set:
      context: "<<An ADR needs a unique identifier — to build its web URL and to name it in CLI commands like edit or preview.>>"
  - id: decision
    set:
      decision: "<<Identify each ADR by its number — the numeric filename prefix (e.g. 0001-...). Titles can be duplicated and full filenames are long to type, whereas the number is already what tools like adr-tools use as the unique ID.>>"
  - id: consequences
    set:
      consequences: "<<Each ADR is addressed by its number; the full filename could later be supported as a secondary CLI identifier.>>"
