[package]
name = "jigc-engine"
version = "0.1.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The deterministic, content-empty core of jigc: schema-driven document parsing and byte-stable writes, workflow composition, validation and the edge index."
keywords = ["coding-agents", "llm", "documentation", "markdown", "schema"]
categories = ["development-tools", "parser-implementations"]
# No `readme`: the root README describes the `jigc` package, not this one (release.md →
# What the package carries). `LICENSE-MIT`/`LICENSE-APACHE` here are symlinks to the root
# pair, packaged as regular files.

[lib]
name = "jigc_engine"

[dependencies]
blake3.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
