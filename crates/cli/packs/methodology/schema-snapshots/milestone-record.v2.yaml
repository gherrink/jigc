# milestone-record.v2 — the prior (pre-`workflow`) shape of the `milestone-record`
# doctype: the `tasks` item block carrying exactly `task-id` / `intent` / `status`, with
# NO per-sub-task `workflow` leaf, everything else — the `location: milestone-records/`
# home, `id-from: title`, the `base` pin, the three-member `status` enum at both loci —
# IDENTICAL to the current (v3) shape. This is the EXACT committed v2 form a real
# `docs/milestone-records/<id>.md` had before the M49 durability bump.
#
# The SECOND snapshot this doctype ships, and the store's first two-snapshot chain
# (`milestone-record.v1.yaml` beside it). The two are read for different questions and
# neither substitutes for the other: `load_prior_schema(ty, <stamp>)` sources the `from`
# of a BELOW-VERSION doc's migration, so a v2-stamped record diffs against THIS file
# while a v1-stamped one diffs against `.v1.yaml`; the store-sweep's managed-vs-foreign
# classifier reads the whole `1..current` set, so an unstamped v0-era record parses
# against either shape rather than reading as a foreign file to adopt
# (`crate::pack::prior_doctype_schemas`; `design/validation.md` → The managed-vs-foreign
# discriminator).
#
# Diffed against the current (v3) milestone-record shape it classifies as exactly
# `[AddedItemField { tasks/workflow }]` — and that is a **byte no-op** on the corpus: the
# leaf carries no `default:` and is not author-required (it is `set:`-bearing), so
# `apply_added_item_field` returns the source unchanged rather than inventing a value on
# every committed item, and `required-field-present` never demands it. So
# `jigc migrate-corpus` value-bumps the stamp 2→3 and moves no other byte — no authored
# map, unlike the `deferral-ledger.v1` enum-member RENAME (`ValueRemapped`), where which
# old member maps to which new one was a semantic choice.
#
# The `deferral-ledger.v1.yaml` mold (the methodology pack's `load_prior_schema`
# sourcing): a full, real, reviewable prior-schema snapshot — the determinism boundary in
# its strongest form (two genuine declared schemas diffed, never a hand-written migration
# recipe). See corpus-migration.md → Prior-schema sourcing + the `AddedItemField` kind;
# team-ready-state.md → The lifecycle — the committed record (M49).
type: milestone-record
location: milestone-records/
id-from: title
description: The per-milestone team-ready state record — the shared base-SHA pin, the ordered sub-task list, and each sub-task's intent and status, resumable from a fresh clone.
usage: a milestone is executing and its in-flight state (base, sub-tasks, statuses) must be committed and legible so a teammate or fresh session can continue it, not stranded in the gitignored workbench.

sections:
  - id: meta
    header: true
    fields:
      - { id: base, type: string, set: on-create }
      - { id: status, type: enum, of: [active, joined, discarded], set: on-transition }
  - id: tasks
    repeatable:
      id-from: task-id
      block:
        - { id: task-id, type: string, set: on-transition }
        - { id: intent, type: string, set: on-transition }
        - { id: status, type: enum, of: [active, joined, discarded], set: on-transition }
