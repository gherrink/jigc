# The methodology pack's command catalog — the {{cli.<id>}} command-refs the
# dev-task workflow's steps resolve against (self-hosting.md → Verified friction:
# finalize *renders*, it does not *fill*, so the commit `type`/`scope` fields and
# the `summary`/`body` slots must be set BEFORE finalize). `set-field --value` (for
# the `type`/`scope` fields) is a different verb than `set-slot --from-file` (for
# the `summary`/`body` slots); the finalize step wires a command-ref for each.
# Every doc-verb ref carries `--task` + `{ from: "task.id" }` (M17 settle pre-fix
# #3): the workflows themselves create >1 active task, and a `--task`-less doc
# write rejects as soon as a second task is active.
commands:
  - id: set-commit-type
    command: jigc
    args:
      - "doc"
      - "set-field"
      - { from: "task.commit#type" }
      - "--value"
      - { agent: type, hint: "the Conventional-Commits type — the composed step renders the members from the commit schema" }
      - "--task"
      - { from: "task.id" }
    hint: "Set the commit header type before finalize."

  - id: set-commit-scope
    command: jigc
    args:
      - "doc"
      - "set-field"
      - { from: "task.commit#scope" }
      - "--value"
      - { agent: scope, hint: "the Conventional-Commits scope — the area this change touches" }
      - "--task"
      - { from: "task.id" }
    hint: "Set the commit header scope before finalize."

  - id: set-commit-summary
    command: jigc
    args:
      - "doc"
      - "set-slot"
      - { from: "task.commit#summary" }
      - "--from-file"
      - "-"
      - "--task"
      - { from: "task.id" }
    stdin: "the subject line"
    hint: "Stage the commit summary slot from stdin."

  - id: set-commit-body
    command: jigc
    args:
      - "doc"
      - "set-slot"
      - { from: "task.commit#body" }
      - "--from-file"
      - "-"
      - "--task"
      - { from: "task.id" }
    stdin: "the commit body prose"
    hint: "Stage the commit body slot from stdin."

  - id: finalize-task
    command: jigc
    args: ["task", "finalize", { from: "task.id" }]
    hint: "Run validate + commit. One task → one commit."

  # The planning workflow's idempotent-create command-refs (M16 inc-4 / T2). The
  # three running docs are SINGLETONS — `create` fixes the slug to the type id
  # regardless of `--title`, so the title is a fixed literal (ignored on mint, and
  # never reaches the H1 of a singleton). `create` on an already-committed singleton
  # copies-in for warm-append (the idempotent-create mechanism); safe whether or not
  # it exists. The per-entry `add-item`/`set-slot`/`set-field` authoring lives in the
  # author steps as literal guidance (the item id is runtime-minted).
  - id: create-roadmap
    command: jigc
    args: ["doc", "create", "roadmap", "--title", "Roadmap", "--task", { from: "task.id" }]
    hint: "Create-or-update the running roadmap singleton in the current task."

  - id: create-ledger
    command: jigc
    args: ["doc", "create", "deferral-ledger", "--title", "Deferral Ledger", "--task", { from: "task.id" }]
    hint: "Create-or-update the running deferral-ledger singleton in the current task."

  - id: create-log
    command: jigc
    args: ["doc", "create", "decisions-log", "--title", "Decisions Log", "--task", { from: "task.id" }]
    hint: "Create-or-update the running decisions-log singleton in the current task."

  # The completion workflow's create-fresh command-ref (M16 inc-5 / T2). The
  # completion-record is `id-from: title` (per-milestone, NOT a singleton) — `create`
  # mints `completions/<milestone>.md` fresh from the agent's title (the adr/arch-doc
  # mint), so `--title` carries the agent-supplied milestone title, never a fixed
  # literal. The per-entry `set-field`/`add-item`/`set-slot` authoring lives in the
  # author step as literal guidance (the create-fresh slug is runtime-minted).
  - id: create-completion-record
    command: jigc
    args:
      - "doc"
      - "create"
      - "completion-record"
      - "--title"
      - { agent: title, hint: "the milestone this completion record closes — its title mints the create-fresh slug" }
      - "--task"
      - { from: "task.id" }
    hint: "Create the per-milestone completion-record fresh in the current task."

  # The planning workflow's gate-record create-fresh command-ref (M49 Inc-9 / T6).
  # `planning-record` is `id-from: title` (per-milestone, NOT a singleton) — `create`
  # mints `planning-records/<milestone>.md` fresh from the agent's title (the proven
  # completion-record mint), so `--title` carries the agent-supplied milestone title,
  # never a fixed literal. The per-gate `set-slot` authoring is NOT written out beside
  # this ref: the author step renders `{{schema:planning-record}}`, so the fourteen
  # gates and their hints are generated from the resolved schema and a fifteenth gate
  # needs no edit here.
  - id: create-planning-record
    command: jigc
    args:
      - "doc"
      - "create"
      - "planning-record"
      - "--title"
      - { agent: title, hint: "the milestone whose plan-time gates this record answers — its title mints the create-fresh slug" }
      - "--task"
      - { from: "task.id" }
    hint: "Create the per-milestone planning gate-record fresh in the current task."

  # The record-dogfood workflow's create-fresh command-ref (M17 inc-5 / T2). The
  # dogfood-record is `id-from: title` (per-run, NOT a singleton) — `create` mints
  # `dogfood/<run>.md` fresh from the agent's title (the proven completion-record
  # mint), so `--title` carries the agent-supplied run title, never a fixed
  # literal. The per-field `set-field`/`set-slot` authoring lives in the author
  # step as literal guidance (the create-fresh slug is runtime-minted).
  - id: create-dogfood-record
    command: jigc
    args:
      - "doc"
      - "create"
      - "dogfood-record"
      - "--title"
      - { agent: title, hint: "the measured run this record captures — its title mints the create-fresh slug" }
      - "--task"
      - { from: "task.id" }
    hint: "Create the per-run dogfood-record fresh in the current task."

  # The do-research workflow's create-fresh command-ref (M37 inc-4 / T1). `research`
  # is `id-from: title` (one-per-doc, NOT a singleton) — `create` mints
  # `research/<slug>.md` fresh from the agent's title (the create-adr mint), so
  # `--title` carries the agent-supplied question, never a fixed literal. The
  # per-slot `set-slot` authoring lives in the author step as literal guidance (the
  # create-fresh slug is runtime-minted).
  - id: create-research
    command: jigc
    args:
      - "doc"
      - "create"
      - "research"
      - "--title"
      - { agent: title, hint: "the question this investigation answers — its title mints the create-fresh slug" }
      - "--task"
      - { from: "task.id" }
    hint: "Create the per-investigation research record fresh in the current task."

  # The park-idea workflow's create-fresh command-ref (M37 inc-4 / T2). `idea` is
  # `id-from: title` (one-per-doc, NOT a singleton) — `create` mints `ideas/<slug>.md`
  # fresh from the agent's title (the create-adr mint), so `--title` carries the
  # agent-supplied direction name, never a fixed literal. The per-field `set-field`
  # (trigger) + per-slot `set-slot` (description) authoring lives in the author step as
  # literal guidance (the create-fresh slug is runtime-minted).
  - id: create-idea
    command: jigc
    args:
      - "doc"
      - "create"
      - "idea"
      - "--title"
      - { agent: title, hint: "a short name for the shaped direction — its title mints the create-fresh slug" }
      - "--task"
      - { from: "task.id" }
    hint: "Park the shaped direction as a fresh idea doc in the current task."

  # The report-jigc-feedback workflow's create command-ref (M55 Increment 8 / T1), on
  # the create-idea mold. `jigc-feedback` is `id-from: title` (one doc per finding), so
  # `--title` carries the agent's short name for what it observed. No create-only flag:
  # the workflow's create-gate entry carries `new: true`, so a title whose slug a doc on
  # disk already holds is refused `create.already-exists` before copy-in
  # (design/findings-channel.md → 4). The per-field and per-slot authoring lives in the
  # author step as literal guidance (the slug is runtime-minted).
  - id: create-jigc-feedback
    command: jigc
    args:
      - "doc"
      - "create"
      - "jigc-feedback"
      - "--title"
      - { agent: title, hint: "a short name for what you observed about jigc — its title mints the new finding's slug" }
      - "--task"
      - { from: "task.id" }
    hint: "File one new jigc-feedback finding in the current task."

  # The report-inconsistency workflow's create command-ref (M55 Increment 8 / T1), on
  # the create-idea mold. `inconsistency` is `id-from: title` (one doc per
  # disagreement); create-only comes from the workflow's `new: true` gate entry, never
  # a flag here. The sides (`add-item … --slug`), fields and slots are authored by the
  # author step as literal guidance.
  - id: create-inconsistency
    command: jigc
    args:
      - "doc"
      - "create"
      - "inconsistency"
      - "--title"
      - { agent: title, hint: "a short name for what disagrees — its title mints the new record's slug" }
      - "--task"
      - { from: "task.id" }
    hint: "File one new inconsistency record in the current task."

  # The form-vision workflow's idempotent-create command-ref (M37 inc-4 / T3). The
  # `vision` doctype is a SINGLETON (the create-roadmap/create-log shape) — `create`
  # fixes the slug to the type id regardless of `--title`, so the title is a fixed
  # literal (ignored on mint; the H1 comes from the `display-title: Vision` knob, never
  # this title). `create` on the already-committed singleton copies-in for warm-append
  # (the idempotent-create mechanism), so `form-vision` re-entry safely targets the same
  # `vision/vision.md`. The `set-field grounded-in` + per-slot authoring lives in the
  # author step as literal guidance.
  - id: create-vision
    command: jigc
    args: ["doc", "create", "vision", "--title", "Vision", "--task", { from: "task.id" }]
    hint: "Create-or-update the running vision singleton in the current task."

  # The read-back command-ref (M48 inc-3 / T1). The ONLY read verb in this catalog:
  # every other entry writes. `jigc doc show` has shipped since M43 and six consecutive
  # trials still went to the filesystem to read in-flight work, so the menu `describe`
  # projects is where it stops hiding (`surface-contract.md` → law 2). `--task` is the
  # point of the entry, not a formality — the methodology work-docs are appended to
  # across a long task (roadmap, decisions-log, milestone-record), so what the author
  # needs to re-read is almost always the STAGED copy the committed store does not
  # carry yet, served through the identical parse/slice path.
  - id: show-doc
    command: jigc
    args:
      - "doc"
      - "show"
      - { agent: address, hint: "the doc address to read — `<type>:<slug>`, or a `#section`/item/leaf slice of it" }
      - "--task"
      - { from: "task.id" }
    hint: "Read a managed doc back — the committed copy, or with `--task` the staged copy of your own in-flight write."
