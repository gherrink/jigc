Migrate the foreign research/investigation note into a managed `research` doc. Below is
the foreign source the CLI staged for you (read-only context — you author the canonical
record through the write verbs, you never edit this file or place anything yourself):

{{ source }}

The target schema and its batch payload, both generated from the resolved `research`
schema, follow — the CLI creates the record and places every prose slot over a single
staged buffer:

{{ schema:research }}

Map the foreign note's content onto the schema above — mechanically:

  - the foreign Question / Problem / "what we wanted to know" framing maps to the
    `question` slot; when the foreign note states no question, derive it from what the
    findings answer ("What does <the note's subject> look like in practice?");
  - the foreign Findings / Results / Notes / observations body maps to the `findings`
    slot (keep the evidence, one bullet or paragraph per finding);
  - the foreign links, citations, "see also" pointers, and named prior art map to the
    `sources` slot; when the foreign note names no source, record where the evidence
    came from in a phrase ("first-hand notes from <context>").

Set the `date` from the foreign source's HISTORICAL date when one is present — an
authored date overwrites the CLI's on-create stamp. The generated payload above omits
the `meta` entry (its `date` is CLI-stamped by default), so TRANSCRIBING a historical
date means adding the entry, exactly as the date appears in the source:

  - id: meta
    set:
      date: "<YYYY-MM-DD>"

When the foreign source is DATELESS, add no `meta` entry — in migration the CLI does
NOT fabricate today's date, so a dateless note stays dateless (no false history).

The research schema is a ref-free leaf — it declares no structural ref, so a foreign
cross-reference stays plain prose in the slot it belongs to; never invent a field for it.

`<slug>` is the slug the title minted, and this task's own index names it back —
every doc the task stages, each by the `<type>:<slug>` identity the read takes:

jigc doc list research --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show research:<slug> --task {{task.id}}
