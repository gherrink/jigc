Migrate the foreign parked-idea note into a managed `idea`. Below is the foreign
source the CLI staged for you (read-only context — you author the canonical record
through the write verbs, you never edit this file or place anything yourself):

{{ source }}

The target schema and its batch payload, both generated from the resolved `idea`
schema, follow — the CLI creates the record and places its header fields and
description slot over a single staged buffer:

{{ schema:idea }}

The `trigger` field is REQUIRED — the de-park condition that would resurface this idea.
Map it mechanically:

  - the foreign note names a revisit condition ("once X ships", "when Y stabilizes",
    "blocked on Z") → transcribe that condition as the `trigger`;
  - the foreign note names NO condition → derive the trigger from the idea's own subject
    ("a concrete need for <the idea's subject> shows up") — never leave `trigger` out.

Set the `date` from the foreign source's HISTORICAL date when one is present: add
`date: "<YYYY-MM-DD>"` to the `meta` section's `set:` map, exactly as it appears in the
source — an authored date overwrites the CLI's on-create stamp. When the foreign source
is DATELESS, OMIT the `date` key entirely — in migration the CLI does NOT fabricate
today's date, so a dateless note stays dateless (no false history).

Everything else in the foreign note — the sketch, the rationale, the caveats — folds
into the `description` prose. A foreign reference to another document becomes plain
prose ("see X"); the idea schema is a ref-free leaf, so never invent a field for it.

`<slug>` is the slug the title minted, and this task's own index names it back —
every doc the task stages, each by the `<type>:<slug>` identity the read takes:

jigc doc list idea --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show idea:<slug> --task {{task.id}}
