File the finding on a fresh jigc-feedback doc. Create it — the slug is minted from
the title you give (a short name for what you observed):

{{ cli.create-jigc-feedback }}

This task files exactly one NEW finding. A title whose slug a doc on disk already
holds is refused `create.already-exists`, with nothing staged — choose a distinct
title, or keep it and pass `--slug <slug>` to the same create.

The `jigc-feedback` schema is the authority on what you write into it — its required
slots and fields, each field's enum members, the convention each string field
follows, and every address a write can take:

jigc doc schema jigc-feedback

Every `--from-file -` below reads its payload from stdin — attach it as a heredoc
directly to the `jigc` command, never as a `cat payload | jigc …` pipeline, which
jigc itself accepts but an agent harness that statically analyses shell commands
can refuse to run:

jigc doc set-slot jigc-feedback:<slug>#description --from-file - --task {{task.id}} <<'EOF'
<what jigc did, and what you expected instead>
EOF

Set the `kind` (`bug`, `inconvenience` or `feedback`), where you found it
(`found-in`, as `<kind>:<label>`) and the jigc version in use (`jigc-version` —
`jigc --version` prints it). Set `about` too when you can name the surface it
concerns. The `status` defaults to `open`, and the `date` is CLI-set on create:

jigc doc set-field jigc-feedback:<slug>#meta/kind --value <bug|inconvenience|feedback> --task {{task.id}}
jigc doc set-field jigc-feedback:<slug>#meta/found-in --value "<kind>:<label>" --task {{task.id}}
jigc doc set-field jigc-feedback:<slug>#meta/jigc-version --value <version> --task {{task.id}}
jigc doc set-field jigc-feedback:<slug>#meta/about --value "<surface>" --task {{task.id}}

Then author the `description` — what was observed — and, when you have one, the
`repro`. Write the repro as a FENCED code block: an unfenced `#`-led line (a shell
comment, a Markdown heading) is read as a heading and refused
`write.slot-heading-depth`:

jigc doc set-slot jigc-feedback:<slug>#description --from-file - --task {{task.id}}
jigc doc set-slot jigc-feedback:<slug>#repro --from-file - --task {{task.id}}

Or make it one call — the batch alternative to the whole sequence above (run it
instead of the create + per-leaf verbs, or after them — the create it implies
over a doc this task already staged acks `already existed — copied in for
update` and changes nothing): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every leaf in a single
write; the payload's `title:` mints the slug exactly like the create above, and
is refused `create.already-exists` exactly like it:

jigc doc author jigc-feedback --from-file - --task {{task.id}}

`<slug>` is the slug the title minted, and this task's own index names it back —
every doc the task stages, each by the `<type>:<slug>` identity the read takes:

jigc doc list jigc-feedback --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show jigc-feedback:<slug> --task {{task.id}}
