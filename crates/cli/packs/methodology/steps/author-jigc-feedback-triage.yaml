Move one filed jigc-feedback finding off `open`. The intent is:
{{ task.intent }}

Name the finding in the intent in plain words — its slug, without the
`jigc-feedback:` prefix and its colon. The task id is minted from the intent, so
an address-shaped intent mangles it; the address, `jigc-feedback:<slug>`, goes to
the `doc` verbs below and never to `jigc start`. The committed rows, each by its
slug and its `status`:

jigc doc list jigc-feedback

The `jigc-feedback` schema is the authority on what you write into it — each
field's enum members, the convention each string field follows, and every address
a write can take:

jigc doc schema jigc-feedback

A filed finding is append-only by convention. This step changes four leaves —
`status`, `duplicate-of`, `pinned-by` and `resolution` — and nothing else: every
other field and slot stays as it was filed. The first write copies the committed
finding into this task for update; each later write edits that staged copy.

Set the `status` it leaves `open` for — `resolved` (fixed, improved or
documented), `declined`, `duplicate` or `refuted` (re-driven, it does not
reproduce):

jigc doc set-field jigc-feedback:<slug>#meta/status --value <resolved|declined|duplicate|refuted> --task {{task.id}}

For a `duplicate`, name the row it duplicates; for a fix a test pins, name that
test, as `<module>::<test_name>` (or `UNPINNED: <why>`):

jigc doc set-field jigc-feedback:<slug>#meta/duplicate-of --value jigc-feedback:<other-slug> --task {{task.id}}
jigc doc set-field jigc-feedback:<slug>#meta/pinned-by --value "<module>::<test_name>" --task {{task.id}}

Every `--from-file -` below reads its payload from stdin — attach it as a heredoc
directly to the `jigc` command, never as a `cat payload | jigc …` pipeline, which
jigc itself accepts but an agent harness that statically analyses shell commands
can refuse to run:

jigc doc set-slot jigc-feedback:<slug>#resolution --from-file - --task {{task.id}} <<'EOF'
<why the status left open — what fixed it, or why it was declined, a duplicate or refuted>
EOF

Author the `resolution` — a status other than `open` carries one:

jigc doc set-slot jigc-feedback:<slug>#resolution --from-file - --task {{task.id}}

This task's own index names the finding back once the first write has copied it
in:

jigc doc list jigc-feedback --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show jigc-feedback:<slug> --task {{task.id}}
