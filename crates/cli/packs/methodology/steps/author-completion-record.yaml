---
states-constraints: [read.staged-read-back]
---
Record the completion audit on the per-milestone completion-record. Create it fresh
— the slug is minted from the title you give (this milestone):

{{ cli.create-completion-record }}

The `completion-record` schema is the authority on what you write into it — its
required slots and fields, each field's enum members, and every address a write
can take:

jigc doc schema completion-record

Set the meta header — the audit `verdict` (green/red) and the `owner-artifact`: the
repo-relative path to the genuine-audit artifact the orchestrator recorded. That
path MUST live under the owned artifact home `completions/artifacts/<milestone>/` —
write the artifact file there, then name it here. finalize promotes that file in the
same transaction and the presence gate asserts it is durably staged (it never reads
the artifact's bytes — presence, not content):

jigc doc set-field completion-record:<slug>#verdict --value <green|red> --task {{task.id}}
jigc doc set-field completion-record:<slug>#owner-artifact --value completions/artifacts/<milestone>/<file> --task {{task.id}}

Then, for each triaged finding, mint an entry and author it — its `severity`, its
`disposition` (fixed/deferred/contested), and the `evidence` (a string: the file:line,
repro, or trace — not a managed ref). `severity` takes the audit's own grade, HIGH /
MEDIUM / LOW, when the audit graded it; `blocking` / `advisory` are kept for an audit
that only says must-fix-or-not. The item id is minted from the title you give:

jigc doc add-item completion-record:<slug>#findings --title "<the finding>" --task {{task.id}}
jigc doc set-field completion-record:<slug>#findings/<id>/severity --value <HIGH|MEDIUM|LOW|blocking|advisory> --task {{task.id}}
jigc doc set-field completion-record:<slug>#findings/<id>/disposition --value <fixed|deferred|contested> --task {{task.id}}
jigc doc set-field completion-record:<slug>#findings/<id>/evidence --value "<the file:line, repro, or trace>" --task {{task.id}}

The optional `detail` slot takes the finding in prose when the one-line `evidence`
cannot carry it — what the finding was, how it reproduced, what its disposition
rests on. Nothing gates on it, so fill it only where it earns its place:

jigc doc set-slot completion-record:<slug>#findings/<id>/detail --from-file <path> --task {{task.id}}

Every `--from-file -` below reads its payload from stdin — attach it as a heredoc
directly to the `jigc` command, never as a `cat payload | jigc …` pipeline, which
jigc itself accepts but an agent harness that statically analyses shell commands
can refuse to run:

jigc doc author completion-record --from-file - --task {{task.id}} <<'EOF'
<the authoring payload — grammar: `jigc doc author --help`>
EOF

Or make it one call — the batch alternative to the whole sequence above (run it
instead of the create + per-leaf verbs, or after them — the create it implies
over a doc this task already staged acks `already existed — copied in for
update` and changes nothing): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every leaf in a single
write; the payload's `title:` mints the slug exactly like the create above:

jigc doc author completion-record --from-file - --task {{task.id}}

`<slug>` is the slug the title minted, and this task's own index names it back —
every doc the task stages, each by the `<type>:<slug>` identity the read takes:

jigc doc list completion-record --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show completion-record:<slug> --task {{task.id}}
