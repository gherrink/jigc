---
states-constraints: [read.staged-read-back]
---
Log each gap Settle consciously deferred on the running deferral ledger.
Create-or-update the ledger singleton — safe whether or not it already exists (an
existing committed ledger is copied in for append):

{{ cli.create-ledger }}

The `deferral-ledger` schema is the authority on what you write into it — its
required slots and fields, and each field's enum members:

jigc doc schema deferral-ledger

It is not the authority on WHICH doc you write into. What it prints is
type-level: every address it advertises places the doc under a `<slug>`
placeholder, and `deferral-ledger`'s slug is not yours to choose — this
doctype has one fixed identity, the `deferral-ledger:deferral-ledger` every
line below spells. Any other slug is refused (`store.fixed-identity`); the
`--format json` projection names it under `identity`.

Every `--from-file -` below reads its payload from stdin — attach it as a heredoc
directly to the `jigc` command, never as a `cat payload | jigc …` pipeline, which
jigc itself accepts but an agent harness that statically analyses shell commands
can refuse to run:

jigc doc set-slot deferral-ledger:deferral-ledger#entries/<id>/body --from-file - --task {{task.id}} <<'EOF'
<what is owed, and why it was deferred>
EOF

Then, for each deferral, mint an entry and author it: its `kind` (Decision for a
deferred decision, Idea for a parked idea), the `trigger` milestone that resurfaces
it, and the `body` prose for what is owed and why. The `date` is CLI-set on create:

jigc doc add-item deferral-ledger:deferral-ledger#entries --title "<what is owed>" --task {{task.id}}
jigc doc set-field deferral-ledger:deferral-ledger#entries/<id>/kind --value <Decision|Idea> --task {{task.id}}
jigc doc set-field deferral-ledger:deferral-ledger#entries/<id>/trigger --value <milestone> --task {{task.id}}
jigc doc set-slot deferral-ledger:deferral-ledger#entries/<id>/body --from-file - --task {{task.id}}

<!-- once:batch-author-note -->
Or make it one call — the batch alternative to the whole sequence above (run it
instead of the create + per-entry verbs, or after them — the create it implies
over a doc this task already staged acks `already existed — copied in for
update` and changes nothing): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every entry in a single
write. Over an already-committed ledger it copies the committed doc in and
appends — existing entries are untouched; an entry whose title mints an id the
ledger already holds is refused (`write.already-present`), the WHOLE payload
rejected and nothing staged, so edit that entry in place with the per-entry
`set-field` / `set-slot` lines above rather than re-authoring it here:
<!-- /once -->

jigc doc author deferral-ledger --from-file - --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show deferral-ledger:deferral-ledger --task {{task.id}}
