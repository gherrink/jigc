when: migrate a foreign decisions log into the managed decisions log
description: Migrate a foreign decisions log into the managed `decisions-log` singleton — the CLI stages the foreign bytes, the LLM rewrites them to canonical shape through the write verbs, and the task finalizes.
usage: an existing project carries a non-conformant decisions log (a DECISIONS.md, a running "choices we made" file) and `jigc migrate <path> --as decisions-log` is rewriting it into the managed decisions log. Off-router — only reached through the migrate verb.
creates-task: true
selectable: false
suppressed:
  reason: verb-routed — reached only through `jigc migrate <path> --as decisions-log`, which stages the foreign source bytes the author step rewrites; a router pick would compose with no staged source
  expires: never
  door: jigc migrate <path> --as decisions-log
allows-create: [{type: decisions-log, as: log}]
---
