# decisions-log — the methodology pack's running log of decisions made (M16
# inc-4 / T1). A running SINGLETON (fixed slug = the type id), managed directly at
# the repo-root literal `docs/decisions-log.md` via `placement` (design/storage.md
# → Placement; M38 retired the old `location: decisions-log/` folder home), so a
# re-`create` deterministically targets the same committed file — the premise the
# planning workflow's idempotent-create rests on. One repeatable `entries` section;
# each entry records the `date` the
# call was made (CLI-derived on create) and a `why` prose slot for its rationale.
# Driven by planning · Settle and completion · triage.
#
# Section ids are SINGLE WORDS ONLY (`entries`): the multi-word title-case reparse
# defect is deferred — this routes around it. No managed per-entry ref (entries
# cross-reference in prose; the methodology pack composes alone). Engine-native
# types only. See design/methodology-docs.md → The four doctypes.
#
# `display-title: Decisions Log` (M40 A4.3, the `vision` precedent): the H1 reads
# `# Decisions Log`, not the lowercase slug `# decisions-log`. Mint-only —
# committed lowercase-H1 corpora stay conformant.
type: decisions-log
placement: { file: docs/decisions-log.md }
singleton: true
id-from: title
display-title: Decisions Log
description: The running log of decisions made — each with the date it was settled and the reasoning behind it.
usage: the planning loop reaches Settle (or completion reaches triage) and a decision is made worth preserving with its rationale, dated, on the record.

sections:
  - id: entries
    repeatable:
      id-from: title
      block:
        - { id: title, type: string }
        - { id: date, type: date, set: on-create }
        - { id: why, slot: { hint: "Why this was decided — the reasoning, in a sentence or two." } }
