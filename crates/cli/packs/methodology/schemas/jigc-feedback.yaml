# jigc-feedback — the methodology pack's one-per-doc finding ABOUT JIGC ITSELF (M55
# Increment 7 / T1; design/findings-channel.md §1, 1.1, 1.3, 1.5). A bug, an
# inconvenience or a piece of feedback someone working with jigc observed, filed in
# the reporter's own repository (the CLI makes no network calls). One doc per
# finding (S1): reporters write disjoint files and a finding is referenced by its
# own identity. Mints fresh per document (`id-from: title`, `location:
# jigc-feedback/`, resolved through `docs-root`). The id is NAMESPACED (S3) so it
# shadows nothing an adopter defines.
#
# The `meta` header carries the filing leaves. `found-in`, `about`, `jigc-version`
# and `pinned-by` are PLAIN STRINGS WITH A CONVENTION (§1.3), validated by nothing:
# a typed ref cannot hold them (tasks, workflows and reviews are not docs). Their
# grammars, each `kind` member's meaning and the append-only convention (§1.5) live
# in `usage:` — authored prose outside the hash (M47), so the agent reads them where
# it files. `tier` is a STRING enum (numerals were refused at pack-load); its scale's
# one home is the rc.16 charter (§1.4). `status` defaults `open`; there is no
# `promoted` member (R4 M5). `duplicate-of` is the doctype's one managed ref, a
# self-edge with inverse `duplicated-by` — chosen at authoring on the
# `superseded-by`/`grounds` mold and frozen with v1. `date` is the filing date,
# CLI-set on create.
#
# Manifest-FROZEN at schema-version 1 (the methodology schema-manifest.yaml); a
# new doctype owes no snapshot and no migration. See design/findings-channel.md →
# 1.1 and 1.7.
type: jigc-feedback
location: jigc-feedback/
id-from: title
description: One finding about jigc itself — a bug, an inconvenience or a piece of feedback — filed with where it was found, the jigc version in use, and how to reproduce it.
usage: "you observe something about jigc itself while working with it that is worth recording. Its `kind` is `bug` when the binary does something wrong (a false statement, a lost byte, a refused correct act, a wrong exit), `inconvenience` when it does what it says at a cost an agent or human should not pay, and `feedback` when it is an observation or suggestion that names no defect (the member shares its name with the doctype, which files all three kinds). The strings follow a convention nothing validates: `found-in` is `<kind>:<label>`, the kind one of milestone, task, workflow, review or trial and the label free text, not a slug; `about`, when set, is `jigc <verb>`, `workflow:<id>`, `step:<id>`, `doctype:<id>`, a finding code, `guide:<file>`, `dev:<tool>` or `test:<module>`; `jigc-version` is `<semver>[+<short-sha>]`, the version in use when the finding was seen; and `pinned-by`, once a test pins the fix, is `<module>::<test_name>` or `UNPINNED: <why>`. A finding is append-only by convention, which the engine does not enforce: after filing only `status`, `resolution`, `duplicate-of` and `pinned-by` change, and a status other than `open` carries a `resolution`."

sections:
  - id: meta
    header: true
    fields:
      - { id: kind, type: enum, of: [bug, inconvenience, feedback] }
      - { id: found-in, type: string }
      - { id: about, type: string, optional: true }
      - { id: jigc-version, type: string }
      - { id: status, type: enum, of: [open, resolved, declined, duplicate, refuted], default: open }
      - { id: tier, type: enum, of: [tier-1, tier-2, tier-3], optional: true }
      - { id: duplicate-of, type: ref, to: jigc-feedback, card: "0..1", inverse: duplicated-by }
      - { id: pinned-by, type: string, optional: true }
      - { id: date, type: date, set: on-create }
  - id: description
    slot: { hint: "What was observed — what jigc did, and what was expected instead." }
  - id: repro
    slot: { optional: true, hint: "How to reproduce it, as a fenced code block — an unfenced `#`-led line is read as a heading and refused. Leave it empty when there is no repro." }
  - id: resolution
    slot: { optional: true, hint: "Why the status left `open` — what fixed it, or why it was declined, a duplicate or refuted. Leave it empty while the finding is open." }
