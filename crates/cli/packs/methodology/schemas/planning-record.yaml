# planning-record — the methodology pack's PER-MILESTONE plan-time GATE record
# (M49 Inc-9 / T5; design/methodology-docs.md -> The planning gate-record;
# completions/artifacts/M49/settle-record.md -> D9). The symmetric sibling of
# `completion-record`: planning produces a gate-record, completion produces an
# audit-record. NOT a singleton — `id-from: title` mints
# `planning-records/M49.md` create-fresh per milestone, the proven
# completion-record/milestone-record mint.
#
# ONE REQUIRED SLOT PER GATE, and that is the whole doctype. The forcing function
# is the already-built `required-slot-present` conformance: an empty gate-slot
# BLOCKS finalize on the planning task, which is the only reason this doctype
# exists (design/methodology-docs.md:79). D9's first draft settled a repeatable
# `gates` section whose names were data — cheaper per new gate — and the design
# review REVERTED it: a repeatable has no such fence (`min-items` was rejected as
# a frozen trap, and `repeatable-populated` fires only at ZERO items, is advisory,
# and is store-scope only), so a record carrying 3 of the 14 gates would validate
# clean and finalize at exit 0. The bump-per-new-gate cost is real and accepted.
#
# jigc enforces the slot is FILLED and never reads or grades the judgment inside
# it (presence-conformance, never content-scoring — the A-3 bound; a composed step
# emitting a `gap-count >= N` lint would hollow the judgment and is barred).
#
# THE FOURTEEN GATES ARE NOT AUTHORED HERE. design/methodology-docs.md's gate
# table is their single home, and each `hint:` below carries that gate's
# "What it requires recorded" cell VERBATIM — the commitment made at
# design/methodology-docs.md:77 ("those sentences move verbatim into the schema's
# `hint:`; nothing is redesigned"). Verbatim costs nothing at the freeze: since
# M47 a slot `hint:` sits OUTSIDE the schema-hash (the presentation projection),
# so sharpening a gate's wording is free and needs no version bump.
#
# Its OWN `location:` — never `completions/`. The reconcile sweep parses every
# file in a location dir against EVERY schema declaring that dir, so two doctypes
# sharing one home cross-block each other (design/measurement.md:81, recorded as
# exercised for `completion-record` vs `dogfood-record`).
#
# Section ids are single words or hyphenated (the `open-questions` /
# `unreleased-changes` precedent) — the gate ids themselves. Header-less: the
# schema-version stamp injects its own front-matter `meta`, the roadmap /
# decisions-log / deferral-ledger path. Engine-native leaves only, no managed ref
# (the M16 "no per-entry managed ref until a driver earns it" bound).
#
# NEW AT M49, so FREE AT THE FREEZE: a new doctype owes a manifest entry and moves
# no other doctype's hash, and it owes NO `schema-snapshots/` entry — there is no
# prior version to diff against (implementation/doctype-authoring.md -> Freeze /
# versioning).
type: planning-record
location: planning-records/
id-from: title
description: One milestone's plan-time gate record — every planning gate answered with the evidence that discharges it, or an explicit N/A and why.
usage: a milestone is being planned, and each plan-time gate needs an answer recorded before the plan is allowed to close.

sections:
  - id: reuse-exercised
    slot:
      hint: |-
        every "already exists / just reuses" claim exercised against the **exact new shape** *and its cold-start/empty form* (not analogy). **Exercised means the *semantics* were run, never that the *signature* was read (M42)** — three of M42's six wrong gate-cells passed because someone verified a thing **existed** and not that it **meant** what the design needed: *"`record: &FileStateRecord` is already a parameter — verified by reading the signature"* was true, and that record is a **gitignored, rebuildable cache**, so on a fresh clone every managed doc would have looked foreign. A cell that cites a type, a parameter, or a call site — rather than a behaviour you observed — is **not filled**. **And a "generalize the existing X to all cases" claim is exercised only in the *full pipeline the general case traverses* (M44)** — the narrow case may work because of a property the general case *loses*: M44's path-hash reused the empty-slug fallback, which survives the id mint's re-slugify only *because it drops the slug entirely*; the settled append-to-the-slug form was truncated away by the same cap — verified at the primitive, wrong at the composition, caught only at the design review. Name the narrow case's load-bearing property and check the general case keeps it.
  - id: cheap-vs-robust
    slot:
      hint: |-
        each low-effort path surfaced as a **fork with its long-run cost** *and resolved against the **vision's committed trajectory**, not the local test* — **robust-now** if it's a *one-way door* (costly to reverse once a committed later milestone lands) **or** leaves a *known hole in a goal-complete/declared surface* (a freeze, a v1, a contract); **defer** only a need the vision genuinely doesn't commit to. The *cheap-local default* ("not necessary right now") is the bug; the **vision is the line, not "more."** **Two rationalizations barred** (M34): *"no live/production case to test"* ≠ *"not needed"* — a capability the declared surface needs **now** is provable on a **reconstructed/synthetic** case, so don't defer it for lack of a real instance; and *"premature generality"* applies **only** if the trajectory doesn't commit — if the milestone's *declared deliverable* requires it, it's the job, not gilding. **Fires at *both* plan-time and completion-triage** (a `too-big → defer` of an audit finding gets the same arbitration) and is **adjudicated by an independent advocate** (below), never self-framed by the proposer. **And every fork lists the option that removes the artifact that can drift**, stated and priced like the others — [milestone-planning-workflow.md](../implementation/milestone-planning-workflow.md) → Settle.
  - id: foreclosed-by-doc
    slot:
      hint: |-
        each leaned-on doc/decision that blocks a better path surfaced, its **rationale engaged** — and, where the doc's exclusion **rests on a predicate**, that predicate **tested rather than the exclusion obeyed**: falsifying it admits the item **at the predicate, never at the exclusion** (M46, 2026-08-18). `team-ready-state.md` excluded `milestone finalize` from the destroying-door refusal rule **by name** — *"stays outside the rule by satisfying it … for the remainder **it narrates**"* — which reads as a boundary and refuses the item as new surface. But the exclusion rested on that predicate, and the narration was **false**: a gitignored `secrets.env` died unnamed at exit 0 while three of the four doors carried no narration surface at all. Admitted at the predicate, the fix re-cut from *build a blocking refusal + `--force` at a fourth door* — new surface, and **measured** as a guard-killer (a worktree that did its job holds build output, so refusing on that axis fires on the ordinary fan-out **success** path and trains `--force` into reflex) — to *make the narration true*: same defect, smaller fix, design of record intact. **The tell:** an exclusion phrased as *"outside the rule **by satisfying it**"* is a claim about behaviour, not a boundary — read the predicate and drive it.
  - id: prior-art-reconciled
    slot:
      hint: |-
        for each thing the milestone will build, **every design doc that already touches it agrees** — `grep` the concept across `design/`, don't anchor on the one the charter/map names; a contradiction between locked docs is a **blocking fork**
  - id: census
    slot:
      hint: |-
        every application site of a new *rule* **and every path that must uphold a new *property*** enumerated **by `grep` — the search + its full hit-count recorded, never a hand-list** (a hand-enumerated census silently drops the site nobody thought of), each with acceptance. **And the grep is a *finder*, not a *fence* (M42): the pattern encodes an assumption about where the members live**, so record what the pattern would *miss* — M42 greped `schema.location` and missed `prior.location`, greped `finalize.rs` and missed two CLI members, enumerated five finding clusters and missed two more. **The cell is only complete when it names where the property is *enforced*** — at the point membership is **decided** (a constructor, a trait impl, a serialization), not on a list of sites — **or states honestly that it is enforced by a list, and is therefore expected to rot.** **A third census axis (M45): when a new rule *keys on* an existing schema/enum property, that property's *variant space* is a census too — enumerate its values against the real registry and settle the response for each, because the motivating case exhibits one value and the rule inherits its correctness only there.** M45's Inc-3 settability guard keyed on `set:` and was designed "refuse every `set:` leaf" from the freeze-stamp case (`set: schema-version`) — correct there, a false *"not settable"* over `set: on-create`, which a shipped migration flow must author; the miss survived five auditors + four detectors + a robust-advocate (none was pointed at the `set:` kinds) and halted the build-planner at Inc 3. This is the plan-time face of [dev-workflow.md](../implementation/dev-workflow.md) → *"widen a guard's trigger, re-derive its response across the whole new domain"*: the Settle widened the guard's domain from a value to a property and never re-derived the response per variant. *(See "a grep is not a fence", the sibling of "a proptest is not a gate".)*
  - id: integration-seam
    slot:
      hint: |-
        where a new producer feeds an existing consumer, the consumer's **input preconditions are satisfied by the new shape**
  - id: check-scope-pinned
    slot:
      hint: |-
        every new check states **the surface it fires against**
  - id: design-complete
    slot:
      hint: |-
        every **net-new** feature graduated to "build" has **settled semantics** — behaviour + (if a check) finding-id / severity / scope + acceptance — concrete, never a name + "lighter/somehow/TBD"; *decided-to-build ≠ designed-to-decompose*
  - id: acceptance-spiked
    slot:
      hint: |-
        every acceptance flow's **behaviour *and commands*** spiked on the real binary — driven **through the shipped verb's entry point, never a core function below its assembly/entry gate** (that gate is exactly where the integration defect hides; a green core-level test is unit coverage, not acceptance)
  - id: value-flow-exercised
    slot:
      hint: |-
        the milestone's **genuine end-to-end value flow** driven on the binary at baseline
  - id: deliverable-reachable
    slot:
      hint: |-
        each capability the milestone **declares as its deliverable** reachable **end-to-end through the shipped user-facing surface** (the verb / CLI / adapter), not only the engine or tests — *built + unit-tested ≠ delivered* if the shipped surface can't invoke it for the committed-trajectory use case (a declared surface that is engine-only/test-only is hollow). **And reachable includes *invoked* (M42): for an agent-facing capability, does the pack ever *tell* an agent to use it?** `maps-to-test` shipped with a working write path, a live **blocking** check, and a JSON read-back — every code gate green — and **zero writes ever**, because the only pack text naming it said *"leave it off entirely."* **A capability the composed workflow never names is unreachable in the only way that matters.**
  - id: strategic-claim-fresh
    slot:
      hint: |-
        the milestone's **justification** (value / readiness / why-now) verified against the **latest evidence** (studies, completion records), not a framing doc that may predate it
  - id: quote-attributed
    slot:
      hint: |-
        every **quoted surface string** the design reasons from is verified by **locating its producer in code**, never by re-reading the quote. A quoted route, ack, message or help line is a claim about *which function emits it*, and that claim is invisible to prose review — the words are right, so the reasoning *looks* checked. **M48 failed this three times in one wave, each time right about the defect and wrong about the set:** the Settle refused F10's convergence because it *"would make the finding say `ingest, migrate, or move it out of the managed location` about a stamped managed doc"* — but that string is `conformance_advisory_finding`'s **own** route, not the code being converged onto, so the lie was **already there** and the settled split **kept** it, making the route wrong for *100%* of the arm's remaining population (caught at the increment-4 plan halt, by an agent that read the two producers). The same wave settled a CI fence as *"diff `git show HEAD~1:<manifest>`"* — a claim about **what a run inspects**, false because Actions fires one run per push at the tip, so the fence was provably clean over the one re-pin in the repo's history (caught at the increment-11 plan halt, by `git reflog` + `rev-list --count`). And its completion audit prescribed a predicate as *"non-staged"* that was **too narrow** by one home (caught by the fixer, not the auditor). **The cell is filled by naming the producer** (`file:symbol`) for each quoted string the fork turns on — not by quoting it accurately.
  - id: claim-driven
    slot:
      hint: |-
        every **load-bearing claim that arrives second-hand** — from a delegated subagent, a prior wave's record, or a doc — is either **driven before it enters the record**, or **marked as relayed** where it is written. The sibling of `quote-attributed` one level out: that gate binds a quoted *string* to its producer; this binds a reported *fact* to an execution. The failure is invisible for the same reason — the claim is well-formed and cites a file, so the reasoning *looks* checked. **M46 failed this four times in one wave, and the delegation instruments are what caught it, not review:** an auditor's *"`tasks.json` does not exist at rc.11"* was relayed into the scope audit unverified, reported onward as fact, and survived a full reporting cycle before the gap pass found the constant at `milestone.rs:41` — with the sharing documented as designed in a locked doc. The same wave relayed `finalize.base-mismatch` as an unnoticed hole (it is a **recorded exclusion**, M47 Settle Decision 1, mirrored in four docs), N-4's repair path in **both** directions, and an advocate's fan-out topology claim that the orchestrator's own race test then falsified. **And it reached a decision, which is why it is a gate and not a note:** D3 — *"at the 1.0 pin, stamp-absent means foreign"* — was affirmed by the human on the orchestrator's recommendation and **withdrawn the same day**, on a premise checkable in **one command** (`jigc ingest` is register-only, so it adopts without a stamp and the population the affirmation called *empty at the pin* is refilled continuously by the product's own front door). **The cell is filled by naming what was driven** — the command and its observed output — for each claim the plan turns on; a claim that was not driven is written into the record **as relayed**, never silently promoted. **An advocate's proposal and the orchestrator's halt recommendations are claims too** — each is driven end to end, through the *other* party's next step (the other open task, the join, the reader), before it reaches the human. M55 failed this twice: S4's refusal design was reversed at the design review, because its route un-staged the code task's work and ended in `finalize.nothing-staged`, and the O2 halt's recommendation to omit `step:author-commit` was contradicted by the gate-record's own evidence.
