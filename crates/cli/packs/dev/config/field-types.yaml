# pack/config/field-types.yaml — the dev pack's pack-declared field types (the
# M10 extension axis). Each entry binds a type spelling to the probe that
# adjudicates it; a schema field naming the spelling resolves to a
# `FieldType::Pack` carrying that adjudicator, exactly as a `ref` field means
# `ref-resolves` applies. The engine ships NONE of these (the engine-empty
# invariant); the CLI reads this file and threads the set into `load_schema`.
# `code-anchor` is the first pack-declared field type — its `doc-code` adjudicator
# (the file/symbol-existence + criterion→test probe) is built later in the arc.
# See document-type-schema.md → Pack-declared field types;
# DECISIONS.md 2026-06-06 → M10 Increment 1 / T1 + T3.
#
# `hint:` is the type's **value grammar** — the shape an author has to write. It is
# declared HERE because a pack-declared type's value shape is invisible to the engine
# (a probe adjudicates it), so the pack is the only place that can state it, and every
# surface that names the type renders this one string verbatim: the `jigc doc schema`
# listing, the `{{schema:<doctype>}}` authoring projection, and `jigc doc set-field
# --help`. Authored once, rendered three times — RC-m50's F-1 was four surfaces naming
# the type and none naming its shape. It rides no schema-hash and no pinned json key (a
# field type serializes to its bare spelling), so editing it is a prose edit.
- name: code-anchor
  adjudicator: doc-code
  check: symbol-exists
  hint: "<repo-relative-path>[#<symbol>]"
