Map the foreign PRD's headings onto the schema above:

  - the foreign Vision / Overview / Summary / Goal heading maps to the `vision` slot;
  - the foreign Context / Background / Motivation / Constraints heading maps to the
    `context` slot;
  - the foreign Requirements / Features / Must-haves / User-stories list maps to the
