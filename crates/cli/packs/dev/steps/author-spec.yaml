Draft the spec for this change. The intent is:
{{ task.intent }}

Create the spec, then author its slots:

{{ cli.create-spec }}
<<author: {{ task.spec#goal }}>>
<<author: {{ task.spec#context }}>>

The `spec` schema is the authority on what you write into it — its required
slots and fields, each field's enum members, and every address a write can take:

jigc doc schema spec

State the non-goals too — what this change will explicitly NOT do bounds the work
as sharply as what it will; fold them into the `context` slot. Name the concrete
files or modules the change is expected to touch when they are already known, so
a later reader orients without rediscovering them.

If this spec derives from a committed PRD, wire it to that parent so finalize can
check the link resolves. `derived-from` points at one PRD and is optional — set it
only when a PRD already frames this work, and only after that PRD is committed (a
dangling `derived-from` blocks finalize):

jigc doc set-field spec:<slug>#derived-from --value prd:<slug> --task {{task.id}}

Every `--from-file -` below reads its payload from stdin — attach it as a heredoc
directly to the `jigc` command, never as a `cat payload | jigc …` pipeline, which
jigc itself accepts but an agent harness that statically analyses shell commands
can refuse to run:

jigc doc set-slot spec:<slug>#criteria/<id>/statement --from-file - --task {{task.id}} <<'EOF'
<what this criterion must satisfy, testably phrased>
EOF

Then add one criterion per thing the change must satisfy, each testably phrased.
For each, mint the item and write its statement in prose:

jigc doc add-item spec:<slug>#criteria --title "<criterion>" --task {{task.id}}
jigc doc set-slot spec:<slug>#criteria/<id>/statement --from-file - --task {{task.id}}

Or make it one call — the batch alternative to the whole sequence above (run it
instead of the create + per-leaf verbs, or after them — the create it implies
over a doc this task already staged acks `already existed — copied in for
update` and changes nothing): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every leaf in a single
write; the payload's `title:` mints the slug exactly like the create above:

jigc doc author spec --from-file - --task {{task.id}}

`<slug>` is the slug the title minted, and this task's own index names it back —
every doc the task stages, each by the `<type>:<slug>` identity the read takes:

jigc doc list spec --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show spec:<slug> --task {{task.id}}
