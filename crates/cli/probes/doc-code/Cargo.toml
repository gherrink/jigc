# The dev pack's `doc-code` probe — a standalone executable that lives **outside**
# the engine workspace ([module-layout.md](../../../../../implementation/module-layout.md)
# → Probe boundary: "Probe executables live outside the workspace"). It is NOT a
# `[workspace].members` entry of the root manifest (the root excludes this path), so
# its dependencies (tree-sitter, from T2) never enter the engine/cli lock graph. It
# re-declares the locked JSON wire shapes ([validation.md](../../../../../design/validation.md)
# → The wire contract) as its own serde structs — it cannot depend on `engine`.
# An empty `[workspace]` table makes this its own workspace root, fully detaching it
# from the engine/cli workspace (it lives under a member's dir tree). The root manifest
# also lists it in `workspace.exclude` for explicitness.
[workspace]

[package]
name = "doc-code"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "doc-code"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
