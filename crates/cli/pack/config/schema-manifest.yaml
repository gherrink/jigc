# schema-manifest.yaml — the dev pack's frozen v1 doctype-set manifest.
#
# The versioned/hashed declaration that makes the doctype-set + schema-definition
# format a FROZEN v1 and the freeze self-enforcing: the engine recomputes each
# shipped doctype's schema-hash (blake3 of its canonical JSON) and requires it to
# match the entry here, with the declared set and the shipped set exactly equal.
# A schema-shape change that bumps no version — or a doctype added/removed without
# touching this file — fails LOUDLY at pack-load / build time, not at review
# (design/corpus-migration.md → The freeze, declared and enforced).
#
# v1 frozen set = the SIX persisted dev-pack doctypes proven byte-stable. The
# methodology self-host doctypes are out of the productive-go v1 freeze; the
# mechanism is general (an absent manifest = unchecked, an unlisted shipped
# doctype = ExtraEntry). To change a frozen schema's shape you bump its
# schema-version and re-freeze its hash here (the means to satisfy a blocked
# change is the M34 corpus migration).
#
# `schema-version` is the doctype's own version (v1 at the freeze); `schema-hash`
# is engine::manifest::schema_hash of its definition. Regenerate a hash only
# alongside a deliberate, versioned schema change — never to silence this gate.
doctypes:
