# schema-manifest.yaml — the dev pack's frozen v1 doctype-set manifest.
#
# The versioned/hashed declaration that makes the doctype-set + schema-definition
# format a FROZEN v1 and the freeze self-enforcing: the engine recomputes each
# shipped doctype's schema-hash (blake3 of its canonical JSON) and requires it to
# match the entry here, with the declared set and the shipped set exactly equal.
# A schema-shape change that bumps no version — or a doctype added/removed without
# touching this file — fails LOUDLY at pack-load / build time, not at review
# (design/corpus-migration.md → The freeze, declared and enforced).
#
# v1 frozen set = the SIX persisted dev-pack doctypes proven byte-stable. The
# methodology pack ships its OWN manifest since M40 A1 (each pack declares its
# own frozen set); the mechanism is general (an absent manifest = unchecked, an
# unlisted shipped doctype = ExtraEntry). To change a frozen schema's shape you bump its
# schema-version and re-freeze its hash here (the means to satisfy a blocked
# change is the M34 corpus migration).
#
# `schema-version` is the doctype's own version (v1 at the freeze); `schema-hash`
# is engine::manifest::schema_hash of its definition. Regenerate a hash only
# alongside a deliberate, versioned schema change — never to silence this gate.
#
# THE HASH IS A PRESENTATION PROJECTION (M47). schema_hash digests the schema with
# three AUTHORED-PROSE keys erased — `description:`, `usage:`, and every slot `hint:`
# (both loci, nested repeatables included) — so rewording one of them needs NO bump
# and NO re-pin here. Everything else stays in, the six SEMANTICS keys included
# (`default` / `set` / `inverse` / `inverse-card` / `check` / `title-names-symbol`):
# they change what the tool WRITES and ADJUDICATES, so they remain declared contract
# changes. While prose sat inside the hash the freeze was unfenceable — a hint reword
# and an enum widening were the same keystroke, guarded only by the line above
# (design/corpus-migration.md → The freeze).
#
# THE SUCCESSOR RULE, stated forward from M47 Increment 1 and FENCED since M48
# Increment 11: a SCHEMA-SHAPE change moves a doctype's `schema-hash` only together
# with its `schema-version`, and a SLUG-RULE change moves `slug-rule.hash` only
# together with `slug-rule.version`.
#
# The fence fires in CI, over the pushed range — it reads both manifests at the base
# of that range and at its tip, and fails on any entity whose hash moved while its
# co-located version stood still. It is not a pack-load assert: pack-load still only
# recomputes each hash against the shipped schema, and one state of the tree cannot
# tell a legitimate re-pin from a silent breach. A legitimate re-pin declares itself
# per entity, on the commit that does it —
#
#     Manifest-Repin: <doctype | slug-rule>
#
# — never blanket: a blanket escape would restore "re-pin the hash" as one keystroke
# with two meanings, merely renamed. M47 Increment 1 is the declared genesis exemption
# and the ONLY one: the narrowing re-pinned all 16 doctype hashes at unchanged
# schema-versions BY CONSTRUCTION — no schema's shape moved, only what the hash is
# computed over. [Corrected 2026-09-15: 16 was the two shipped manifests' listed total
# AT M47 Increment 1; they list 17 entries between them today. That increment's own
# measurement stays — a historical count is dated, never re-pinned to today, or the
# record stops stating what it measured (M51 Increment 7; the live total is fenced by
# crates/cli/tests/count_fences.rs).] It predates the fence, and is now the fixture that
# proves it fires (crates/cli/tests/manifest_freeze_fence.rs).
#
# TWO DECLARED BOUNDS, recorded rather than glossed: the fence protects this repo only,
# not adopters (it lives in this repo's CI, and this repo is the only party that edits
# a manifest), and it is a build fence, not a surface — it mints no finding code, no
# route and no verb. The two other candidate mechanisms stay refused: an append-only
# (type, version) -> hash ledger asserted at pack-load would protect adopters too, but
# it is a new stored format; and the successor rule as an in-process check is
# unimplementable in-process, since a pack-load assert cannot observe a CHANGE without
# a recorded prior (design/corpus-migration.md → The freeze; M48 settle-record).
#
# `slug-rule` (M42) declares the IDENTITY-MINT rule the ids inside every doctype
# above are derived by — `engine::slug::slugify`, which sits in no schema-hash, so
# this gate was blind to a change in the one function that names every id in every
# corpus. `version` is engine::slug::SLUG_RULE_VERSION; `hash` is
# engine::slug::rule_fingerprint() — a blake3 digest of the rule's behaviour over a
# GENERATED input vector (every printable ASCII char in two frames, every
# transliteration entry, every edge stopword at every position, inputs crossing both
# caps). A slug-rule change CANNOT be migrated after the fact (no transform kind
# re-mints an id) — a corpus that spans one carries two id generations permanently —
# so it is a declared event: bump slug-rule-version AND re-pin the hash here and in
# packs/methodology/config/schema-manifest.yaml, together, in one commit
# (design/storage.md → Identity → The slug rule is itself a versioned rule).
