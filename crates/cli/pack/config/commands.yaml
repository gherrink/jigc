# The MVP command catalog — the {{cli.<id>}} command-refs the single-task
# workflow's steps resolve against. See design/command-catalog.md → Worked
# catalog. The catalog parser arrives with the composer (later in increment 3);
# these bytes are the canonical contract it will load.
# Every doc-verb ref carries `--task` + `{ from: "task.id" }` (M17 settle pre-fix
# #3): with more than one active task a `--task`-less doc write rejects, and the
# workflows themselves create that state.
commands:
  - id: set-commit-summary
    command: jigc
    args:
      - "doc"
      - "set-slot"
      - { from: "task.commit#summary" }
      - "--from-file"
      - "-"
      - "--task"
      - { from: "task.id" }
    stdin: "the slot prose"
    hint: "Stage the commit summary slot from stdin."

  - id: set-commit-type
    command: jigc
    args:
      - "doc"
      - "set-field"
      - { from: "task.commit#type" }
      - "--value"
      - { agent: commit_type, hint: "the Conventional-Commits type for what changed — the composed step renders the members from the commit schema" }
      - "--task"
      - { from: "task.id" }
    hint: "Set the required Conventional-Commits type."

  - id: validate-task
    command: jigc
    args: ["task", "validate", { from: "task.id" }]
    hint: "Preview part of the finalize gate — the repository posture, content findings, carryover, owner-artifact, the granted-but-unused changelog gate — without committing."

  - id: finalize-task
    command: jigc
    args: ["task", "finalize", { from: "task.id" }]
    hint: "Run validate + commit. One task → one commit."

  - id: create-adr
    command: jigc
    args:
      - "doc"
      - "create"
      - "adr"
      - "--title"
      - { agent: title, hint: "short declarative sentence describing the decision" }
      - "--task"
      - { from: "task.id" }
    hint: "Create a new ADR in the current task."

  - id: create-spec
    command: jigc
    args:
      - "doc"
      - "create"
      - "spec"
      - "--title"
      - { agent: title, hint: "short declarative title naming what the spec delivers" }
      - "--task"
      - { from: "task.id" }
    hint: "Create a new spec in the current task."

  - id: create-prd
    command: jigc
    args:
      - "doc"
      - "create"
      - "prd"
      - "--title"
      - { agent: title, hint: "short declarative title naming the product the prd specifies" }
      - "--task"
      - { from: "task.id" }
    hint: "Create a new prd in the current task."

  - id: create-arch-doc
    command: jigc
    args:
      - "doc"
      - "create"
      - "arch-doc"
      - "--title"
      - { agent: title, hint: "short declarative title naming the part of the system the arch-doc documents" }
      - "--task"
      - { from: "task.id" }
    hint: "Create a new arch-doc in the current task."

  - id: create-changelog
    command: jigc
    args: ["doc", "create", "changelog", "--title", "Changelog", "--task", { from: "task.id" }]
    hint: "Create-or-update the running changelog singleton in the current task."

  - id: bind-spec
    command: jigc
    args:
      - "task"
      - "bind"
      - "spec"
      - { agent: spec_address, hint: "the full spec:<slug> address picked from the committed specs above" }
      - { from: "task.id" }
    hint: "Bind the spec this work implements to the task's spec role."

  - id: milestone-provision
    command: jigc
    args:
      - "milestone"
      - "provision"
      - { agent: milestone_id, from: "milestone.id", hint: "the milestone:<slug> id being executed" }
    hint: "Provision one detached base-pin worktree per sub-task before the fan-out."

  - id: milestone-join
    command: jigc
    args:
      - "milestone"
      - "join"
      - { agent: milestone_id, from: "milestone.id", hint: "the milestone:<slug> id being executed" }
    hint: "Merge the sub-tasks' staged docs by task-id order and report — commits nothing."

  - id: milestone-finalize
    command: jigc
    args:
      - "milestone"
      - "finalize"
      - { agent: milestone_id, from: "milestone.id", hint: "the milestone:<slug> id being executed" }
    hint: "The milestone commit boundary — validate the merged join + commit per the squash knob."

  - id: recompose-task
    command: jigc
    args:
      - "start"
      - "--task"
      - { from: "task.id" }
    hint: "Re-compose the task to pick up the freshly bound slice."

  - id: run-ingest
    command: jigc
    args: ["ingest"]
    hint: "Scan the repo, classify candidate docs, and report the triage verdicts."

  # The read-back command-ref (M48 inc-3 / T1). The ONLY read verb in the catalog:
  # every other entry writes. `jigc doc show` has shipped since M43 and six
  # consecutive trials still went to the filesystem to read in-flight work, so the
  # menu `describe` projects is where it stops hiding (`surface-contract.md` → law 2).
  # `--task` is the point of the entry, not a formality — it serves the task's STAGED
  # copy through the identical parse/slice path, which is the read-back of a write the
  # agent has just made and the committed store does not carry yet.
  - id: show-doc
    command: jigc
    args:
      - "doc"
      - "show"
      - { agent: address, hint: "the doc address to read — `<type>:<slug>`, or a `#section`/item/leaf slice of it" }
      - "--task"
      - { from: "task.id" }
    hint: "Read a managed doc, or an addressed slice of it — with `--task`, the staged copy of your own in-flight write."
