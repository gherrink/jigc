# spec — the M3 persisted doc-type: the "what" a task implements. Persisted to
# specs/; the `goal`/`context` prose slots and a repeatable `criteria` section
# (each a testably-phrased record addressed `spec:<slug>#criteria/<id>/statement`).
# `id-from: title` derives the slug from the document title (the H1, supplied at
# `jigc doc create spec --title "…"`) — exactly like `adr`, which carries NO title
# field; the title is the document's H1, never a declared schema field.
# No `status`/`date` and no `decided-by → adr` relation: nothing in the M3 arc
# reads them, so they stay one-line additions when a flow earns them.
# See document-type-schema.md → On-disk definition format + Sections and
# repetition; implementation/doctype-map.md (spec location);
# DECISIONS.md 2026-06-01 → M3 Increment 1 elaboration pin T1.
type: spec
location: specs/
id-from: title
description: A specification of what a task implements — its goal, its context, and a set of testably-phrased acceptance criteria.
usage: you need to pin down what a piece of work must deliver before building it, so the criteria are agreed up front and code can be checked against them.

sections:
  - id: goal
    slot: { hint: "What this spec delivers — the outcome, in a sentence or two." }
  - id: context
    slot: { hint: "Why it is needed and the constraints that shape it." }
  - id: criteria
    repeatable:
      id-from: title
      block:
        - { id: title, type: string }
        - { id: statement, slot: { hint: "The criterion, testably phrased." } }
        - { id: maps-to-test, type: code-anchor }
