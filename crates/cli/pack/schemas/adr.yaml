# adr — the MVP persisted doc-type (structural skeleton; the create-gate +
# promotion wiring is inc-5). Persisted to decisions/; the `status` header
# section + prose slots, with the optional `supersedes` adr→adr relation.
# See document-type-schema.md → On-disk definition format,
# DECISIONS.md 2026-05-31 → Schema model + commit/adr schema YAML.
type: adr
location: decisions/
id-from: title

sections:
  - id: status
    header: true
    fields:
      - { id: status, type: enum, of: [proposed, accepted, superseded], default: proposed }
      - { id: date, type: date, set: on-create }
      - { id: supersedes, type: ref, to: adr, card: "0..1", inverse: superseded-by }
  - id: context
    slot: { hint: "Why a decision was needed — the forces at play." }
  - id: decision
    slot: { hint: "What we decided, in a sentence or two." }
  - id: consequences
    slot: { hint: "Tradeoffs and follow-on effects." }
