# prd — the M9 new-project doc-type: the first managed document a fresh repo
# develops its idea into. Persisted to prds/; three fixed prose slots and
# nothing else. Per the M9 scope decision (G2, DECISIONS.md 2026-06-06),
# requirements are FIXED PROSE SLOTS — not a repeatable section — so `prd` is
# pure pack data with zero engine work (a repeatable section would hit the
# stubbed `add-item` authoring wall). `id-from: title` derives the slug from
# the document H1, exactly like `adr`/`spec` (no declared `title` field).
#
# Section ids are SINGLE WORDS ONLY (`vision`/`requirements`/`context`): a
# multi-word id trips the logged title-case reparse defect (writer title-cases
# `out-of-scope` → "Out Of Scope", parser flat-compares the raw id), deferred
# in M9 — these slots route around it. No repeatable section, no ref edge.
# See project-setup.md → Flow 1 (the prd doctype); document-type-schema.md;
# DECISIONS.md 2026-06-06 → G2.
type: prd
location: prds/
id-from: title
description: A product requirements document — the vision, the requirements, and the context for a piece of work, the first managed document a fresh project develops its idea into.
usage: you are at the start of a new project and want to turn an idea into a shared statement of what to build and why, before any spec or code.

sections:
  - id: vision
    slot: { hint: "The product vision in a sentence or two." }
  - id: requirements
    slot: { hint: "The product requirements, as a prose bullet list." }
  - id: context
    slot: { hint: "Why it is needed and the constraints that shape it." }
