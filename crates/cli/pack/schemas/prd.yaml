# prd — the M9 new-project doc-type: the first managed document a fresh repo
# develops its idea into. Persisted to prds/; `vision`/`context` are fixed prose
# slots, and `requirements` is a REPEATABLE section — one addressable record per
# requirement (a `title` field + a `statement` slot), mirroring `spec.criteria`
# minus the code-anchor. `id-from: title` derives the slug from the document H1,
# exactly like `adr`/`spec` (no declared `title` field); each requirement item's
# id derives from its own title the same way.
#
# (M25: the repeatable shape replaces the original fixed `requirements` slot —
# the M9-era `add-item` authoring wall and the single-word-id title-case reparse
# defect were cleared by the M13 add-item verb and the M22 multi-word-heading
# parser fix, so a foreign PRD's requirements now get individually-addressable
# structure and the greenfield flow authors them per-item.) No ref edge —
# `prd —decomposes-into→ spec` stays deferred (no migration driver).
# See auto-migration.md → prd; project-setup.md → Flow 1; document-type-schema.md.
type: prd
location: prds/
id-from: title
description: A product requirements document — the vision, the requirements, and the context for a piece of work, the first managed document a fresh project develops its idea into.
usage: you are at the start of a new project and want to turn an idea into a shared statement of what to build and why, before any spec or code.

sections:
  - id: vision
    slot: { hint: "The product vision in a sentence or two." }
  - id: requirements
    repeatable:
      id-from: title
      block:
        - { id: title, type: string }
        - { id: statement, slot: { hint: "The requirement, in a sentence or two." } }
  - id: context
    slot: { hint: "Why it is needed and the constraints that shape it." }
