Document this part of the system as living architecture. The intent is:
{{ task.intent }}

Create the arch-doc — safe whether or not it already exists (an existing committed
arch-doc of the same slug is copied in for revise) — then author its overview:

{{ cli.create-arch-doc }}
<<author: {{ task.arch-doc#overview }}>>

Cite the decisions this part of the system rests on, so finalize can check each
citation still resolves. `cites` is a list — author **all** of them in ONE
`set-field` as a bracketed list (a second `set-field` replaces, not appends, so
repeated single-value calls would keep only the last). One ADR is the list of one:

jigc doc set-field arch-doc:<slug>#cites --value '[adr:<slug-a>, adr:<slug-b>]' --task {{task.id}}

Committed-first ordering: every cited ADR must already be committed before this
task — arch-doc's `allows-create` cannot mint an ADR in-task, so a `cites`
pointing at an uncommitted or absent decision has nothing to resolve against and
a dangling `cites` blocks finalize forever. Cite only committed ADRs; record and
commit the decision first, then cite it here.

Then add one component per architectural piece. For each, mint the item, write
its responsibility in prose, and anchor it to the code that implements it. The
anchor is `<repo-relative-path>#<symbol>`; finalize re-checks it against the
staged index — the code you `git add`ed — so a symbol you wrote but forgot to
stage reads as dangling and blocks:

jigc doc add-item arch-doc:<slug>#components --title "<component name>" --task {{task.id}}
jigc doc set-slot arch-doc:<slug>#components/<id>/description --from-file - --task {{task.id}}
jigc doc set-field arch-doc:<slug>#components/<id>/implemented-by --value <path>#<symbol> --task {{task.id}}

Or make it one call — the batch alternative to the whole sequence above (run it
instead of the create + per-leaf verbs, or after them — the create it implies
over a doc this task already staged acks `already existed — copied in for
update` and changes nothing): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every leaf in a single
write; the payload's `title:` mints the slug exactly like the create above. The
`cites` one-list rule and the committed-first ordering above bind unchanged:

jigc doc author arch-doc --from-file - --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show arch-doc:<slug> --task {{task.id}}
