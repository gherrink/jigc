Create the prd, then author its `vision` and `context` slots on the address
`create` prints — the created doc is a `prd`, so the write address is
`prd:<slug>#<slot>`:

{{ cli.create-prd }}
<<author: prd:<slug>#vision>>
<<author: prd:<slug>#context>>

jigc doc set-slot prd:<slug>#vision --from-file - --task {{task.id}}
jigc doc set-slot prd:<slug>#context --from-file - --task {{task.id}}

Then add one requirement per thing the product must do. For each, mint the item
and write its requirement in prose:

jigc doc add-item prd:<slug>#requirements --title "<requirement>" --task {{task.id}}
jigc doc set-slot prd:<slug>#requirements/<id>/statement --from-file - --task {{task.id}}

Or make it one call — the batch alternative to the whole sequence above (run it
INSTEAD of the create + per-leaf verbs, never after them — an already-staged doc
rejects a second create): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every leaf in a single
write; the payload's `title:` mints the slug exactly like the create above:

jigc doc author prd --from-file - --task {{task.id}}
