---
states-constraints: [read.staged-read-back]
---
Create the prd, then author its `vision` and `context` slots on the address
`create` prints — the created doc is a `prd`, so the write address is
`prd:<slug>#<slot>`:

{{ cli.create-prd }}
<<author: prd:<slug>#vision>>
<<author: prd:<slug>#context>>

jigc doc set-slot prd:<slug>#vision --from-file - --task {{task.id}}
jigc doc set-slot prd:<slug>#context --from-file - --task {{task.id}}

The `prd` schema is the authority on what you write into it — its required slots
and fields, each field's enum members, and every address a write can take:

jigc doc schema prd

Then add one requirement per thing the product must do. For each, mint the item
and write its requirement in prose:

jigc doc add-item prd:<slug>#requirements --title "<requirement>" --task {{task.id}}
jigc doc set-slot prd:<slug>#requirements/<id>/statement --from-file - --task {{task.id}}

Or make it one call — the batch alternative to the whole sequence above (run it
instead of the create + per-leaf verbs, or after them — the create it implies
over a doc this task already staged acks `already existed — copied in for
update` and changes nothing): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every leaf in a single
write; the payload's `title:` mints the slug exactly like the create above:

jigc doc author prd --from-file - --task {{task.id}}

`<slug>` is the slug the title minted, and this task's own index names it back —
every doc the task stages, each by the `<type>:<slug>` identity the read takes:

jigc doc list prd --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show prd:<slug> --task {{task.id}}
