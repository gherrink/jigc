---
states-constraints: [read.staged-read-back]
---
Record a decision you have already made as an ADR — from what you know, with no
code to write. The decision is:
{{ task.intent }}

Create the ADR — safe whether or not it already exists (an existing committed ADR
of the same slug is copied in for revise) — then author its slots: a line per slot
usually suffices; an ADR earns its keep by capturing the *why*, not by running long:

{{ cli.create-adr }}

Author its three required slots on the address `create` prints — `context` (the
forces that made a decision necessary), `decision` (the call itself), and
`consequences` (the tradeoffs and follow-on effects it commits you to):

jigc doc set-slot adr:<slug>#context --from-file - --task {{task.id}}
jigc doc set-slot adr:<slug>#decision --from-file - --task {{task.id}}
jigc doc set-slot adr:<slug>#consequences --from-file - --task {{task.id}}

The `options` slot is optional — fill it only when alternatives were genuinely
weighed. Its `## Options` heading renders either way; an empty optional slot is
conformant and never blocks finalize. The `status` defaults to `proposed`; set it
on the `status` section only when the decision is already `accepted`:

jigc doc set-slot adr:<slug>#options --from-file - --task {{task.id}}
jigc doc set-field adr:<slug>#status --value accepted --task {{task.id}}

Or make it one call — the batch alternative to the whole sequence above (run it
instead of the create + per-leaf verbs, or after them — the create it implies
over a doc this task already staged acks `already existed — copied in for
update` and changes nothing): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every slot in a single
write; the payload's `title:` mints the slug exactly like the create above:

jigc doc author adr --from-file - --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show adr:<slug> --task {{task.id}}
