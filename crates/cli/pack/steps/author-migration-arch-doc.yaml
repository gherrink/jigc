Migrate the foreign architecture document into a managed `arch-doc`. Below is the
foreign source the CLI staged for you (read-only context — you author the canonical
record through the write verbs, you never edit this file or place anything yourself):

{{ source }}

The target schema and its batch payload, both generated from the resolved `arch-doc`
schema, follow — the CLI creates the record and places every edge, slot, and component
over a single staged buffer. This is the ONLY authoring call: the migration commit doc
is auto-provisioned for you, so never `doc author commit`.

{{ schema:arch-doc }}

Map the foreign architecture document's headings onto the schema above:

  - the foreign Overview / Introduction / Summary heading maps to the `overview` slot;
  - each foreign component / module / subsystem section maps to one `components` item —
    a `title`, a `description`, and an optional `implemented-by` code anchor;
  - a foreign "see ADR-N" / decision reference maps to the doc-level `cites` edge.

Every required slot MUST be filled — the `overview` AND each component's `description`.
Both block finalize at `required-slot-present` when empty (neither can drop to prose like
an optional field). SYNTHESIZE when the foreign source has none: a one-line responsibility
for a `description` (from the component's name and its implementing symbol), and a one-line
boundary statement for the `overview` (from the document title and the component set) when
the foreign doc carries no overview / introduction / summary section.

`implemented-by` is OPTIONAL — anchor a concrete `path#symbol` you can carry over verbatim
from the foreign source (add `implemented-by: "<path>#<symbol>"` to the component item's
`set:` block), else OMIT it (an omitted anchor finalizes clean). Architectural components
are coarser than one symbol; a prose pointer ("the auth module") is not a resolvable
anchor — leave it off. A PRESENT anchor whose symbol has vanished blocks finalize at
`doc-code.symbol-exists`.

`cites` is bracketed, IN-STORE-ONLY, drop-to-prose otherwise. Author it under the `meta`
section's `set:` block, multiple citations as ONE bracketed list (set-field replaces, it
does not append):

  - id: meta
    set:
      cites: "[adr:<slug-of-a-cited-decision>, …]"

A foreign "see ADR-12" becomes a `cites` element ONLY when that adr is already in the
committed store; an out-of-store decision reference is folded into the `overview` prose
instead, never authored as a dangling ref (a dangling `cites` blocks finalize forever).

Committed-first ordering: a cited adr must be migrated and committed BEFORE the arch-doc
that cites it (the `ref-resolves` gate resolves against the committed store OR this task's
working area, and arch-doc's `allows-create` cannot mint an adr in-task). When a corpus
migrates ADRs and arch-docs together, migrate the ADR corpus first.

Component titles must be SLUG-DISTINCT — two titles that slugify identically fail the whole
batch atomically (`write.already-present`). Give each component a distinct name.

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show arch-doc:<slug> --task {{task.id}}
