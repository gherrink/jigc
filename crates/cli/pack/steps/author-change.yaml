Record the change on the project changelog. Create-or-update the changelog
singleton — safe whether or not it already exists (an existing committed changelog
is copied in for append):

{{ cli.create-changelog }}

Then author the change. To cut a release, mint a release item (its id is minted
from the version title you give; its `date` is stamped on create) and, if there is
a comparison/diff URL, set the optional `link`:

jigc doc add-item changelog:changelog#releases --title "<version>" --task {{task.id}}
jigc doc set-field changelog:changelog#releases/<version>/link --value "<diff-url>" --task {{task.id}}

Under that release, add one nested change-group per category and author its notes
(one bullet per change). The category is the group's id (added / changed /
deprecated / removed / fixed / security):

jigc doc add-item changelog:changelog#releases/<version>/changes --title "<Category>" --task {{task.id}}
jigc doc set-slot changelog:changelog#releases/<version>/changes/<category>/notes --from-file - --task {{task.id}}

For a change that is not yet cut into a release, add the change-group under the
staged section instead:

jigc doc add-item changelog:changelog#unreleased-changes --title "<Category>" --task {{task.id}}
jigc doc set-slot changelog:changelog#unreleased-changes/<category>/notes --from-file - --task {{task.id}}
