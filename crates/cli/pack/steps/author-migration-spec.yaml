Migrate the foreign spec into a managed `spec`. Below is the foreign source the CLI
staged for you (read-only context — you author the canonical record through the write
verbs, you never edit this file or place anything yourself):

{{ source }}

The target schema and its batch payload, both generated from the resolved `spec`
schema, follow — the CLI creates the record and places every field and prose slot
over a single staged buffer:

{{ schema:spec }}

Map the foreign spec's headings onto the schema above:

  - the foreign Goal / Overview / Summary / Objective heading maps to the `goal` slot;
  - the foreign Context / Background / Motivation / Constraints heading maps to the
    `context` slot;
  - the foreign Acceptance Criteria / Requirements / Done-when list maps to the repeatable
    `criteria` — author ONE item per criterion, each a short `title` plus a testably-phrased
    `statement`. A bullet list, a numbered list, or a table of criteria all fold to one item
    each; keep them one statement apiece, never lumped into a single block.

The `derived-from` edge is IN-STORE-ONLY. Author it (under the `meta` section's `set:`
block, as `derived-from: "prd:<slug>"`) only when the PRD it names is already in the
committed store or migrating in this same pass — a dangling ref blocks finalize forever.
A foreign "from the X PRD" reference with no in-store target folds into the `context`
prose instead.

The `maps-to-test` field carries a real test anchor. A foreign spec that names no test
does NOT get a fabricated anchor — leave `maps-to-test` off the item entirely; a migrated
spec with no test anchors finalizes clean. Wire `maps-to-test` (in the criterion item's
`set:` block, as `maps-to-test: "<path>#<test-fn>"`) only when the foreign criterion
already cites a concrete test symbol you can carry over verbatim.

The `#<test-fn>` names the test symbol — a named test function. A closure-based test
framework registers its tests with no named symbol, so there is nothing to carry over:
drop the `#<test-fn>` and give the `<path>` alone. A file-only anchor is accepted — it
resolves on the file's presence, no symbol required.

A foreign "decided by ADR-X" / "see the auth ADR" reference has no structural edge in the
spec schema (there is no `decided-by` relation) — fold it into the `context` prose instead;
never invent a field for it.

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show spec:<slug> --task {{task.id}}
