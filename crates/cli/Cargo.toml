[package]
name = "jigc"
version = "1.0.0-rc.24"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A context compiler for coding agents: a deterministic CLI that composes each task's instructions and owns every structural write to a project's managed docs."
keywords = ["cli", "coding-agents", "llm", "documentation", "workflow"]
categories = ["command-line-utilities", "development-tools"]
# The crate README `dev/crate-readme` generates from the root README, every relative link
# made absolute so it lands on crates.io where it lands on GitHub (M55 S15). Cargo packages
# a `readme` whatever `include` says, so the allowlist below does not name it;
# `tests/package_contents.rs` holds the packaged bytes equal to the committed file.
readme = "README.md"
# The published allowlist — never the directory, and never `tests/` (M54 S11;
# implementation/release.md → What the package carries). `LICENSE-MIT`/`LICENSE-APACHE`
# here are symlinks to the root pair, packaged as regular files;
# `tests/package_contents.rs` holds the listing equal to this set plus the README.
include = [
    "src/**",
    "packs/**",
    "adapters/**",
    "guides/**",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]
default-run = "jigc"
# The ~250 suite files under `tests/` are NOT cargo targets of their own — they are
# compiled into the 12 group targets declared at the bottom of this file
# (each group root pulls its suites in with `#[path = "../<name>.rs"] mod <name>;`, the
# idiom `tests/pinned_facts.rs` already used). One cargo target per suite file cost a
# **macOS Gatekeeper policy assessment per freshly-linked binary** — measured at ~44 s
# of `syspolicyd` per binary on first execution, i.e. ~3 hours per gate run over 252
# binaries, against 8 minutes of actual test execution. The count of test *files* was
# the multiplier, so the gate got slower with every suite the milestone added.
# `tests/test_target_registration.rs` fences the cost of turning discovery off: a suite
# file that no group root registers would otherwise compile nowhere and silently never
# run.
autotests = false

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "jigc"
path = "src/main.rs"

[dependencies]
# Published as `jigc-engine`, lib `jigc_engine`, renamed back to `engine` here so no
# path into the engine moves in this crate (M54 S12, release.md → Packages and names).
engine = { package = "jigc-engine", version = "=0.1.0-rc.2", path = "../engine" }
clap = { workspace = true }
include_dir = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
libc = { workspace = true }
# The bundled `doc-code` probe's parsers — used only by the `jigc` bin's
# `doc_code_probe` module, never the `cli` lib (M54 S4). Pinned `=` at the versions the
# detached probe's lock carried, so the grammars move only by a deliberate bump.
tree-sitter = "=0.26.9"
tree-sitter-language = "=0.1.7"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-php = "=0.24.2"
tree-sitter-bash = "=0.25.1"
tree-sitter-css = "=0.23.2"
tree-sitter-yaml = "=0.7.2"

[dev-dependencies]
insta = { workspace = true }
semver = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

# The consolidated integration-test targets — see `autotests = false` above.
# Generated grouping; a new suite file must be added to exactly one group root, which
# `tests/test_target_registration.rs` enforces.
[[test]]
name = "g_flow"
path = "tests/groups/g_flow.rs"

[[test]]
name = "g_migrate"
path = "tests/groups/g_migrate.rs"

[[test]]
name = "g_finalize"
path = "tests/groups/g_finalize.rs"

[[test]]
name = "g_migration"
path = "tests/groups/g_migration.rs"

[[test]]
name = "g_item"
path = "tests/groups/g_item.rs"

[[test]]
name = "g_compose"
path = "tests/groups/g_compose.rs"

[[test]]
name = "g_config"
path = "tests/groups/g_config.rs"

[[test]]
name = "g_milestone"
path = "tests/groups/g_milestone.rs"

[[test]]
name = "g_methodology"
path = "tests/groups/g_methodology.rs"

[[test]]
name = "g_doc"
path = "tests/groups/g_doc.rs"

# Solo by necessity — these two suites mutate process-global env vars, which is only
# sound while each is the sole test in its process (see the group roots for the leak
# this prevents). Never fold them into a shared group.
[[test]]
name = "g_solo_store_sweep"
path = "tests/groups/g_solo_store_sweep.rs"

[[test]]
name = "g_solo_trial_corpus"
path = "tests/groups/g_solo_trial_corpus.rs"
