# deferral-ledger — the methodology pack's running record of owed-and-when work
# (M16 inc-4 / T1). A running SINGLETON (fixed slug = the type id), managed
# directly at the repo-root literal `docs/deferral-ledger.md` via `placement`
# (design/storage.md → Placement; M38 retired the old `location: ledger/` folder
# home), so a re-`create` deterministically targets the same committed file — the
# premise the planning workflow's idempotent-create rests on. One repeatable
# `entries` section; each entry pairs a `kind` (a
# decision `D` deferred vs an idea `I` parked) with the `trigger` milestone that
# resurfaces it, the `date` it was logged (CLI-derived on create), and a `body`
# prose slot for the deferral itself.
#
# `trigger` is a plain `string` (a milestone work-unit, not a managed doctype) —
# no managed per-entry ref (the methodology pack composes alone; a `ref:` would
# point outside the composed schema universe). Section ids are SINGLE WORDS ONLY
# (`entries`): the multi-word title-case reparse defect is deferred — this routes
# around it. Engine-native types only. See design/methodology-docs.md → The four
# doctypes; Relations (none managed, by deliberate bound).
type: deferral-ledger
placement: { file: docs/deferral-ledger.md }
singleton: true
id-from: title
description: The running ledger of deferred decisions and parked ideas, each keyed to the milestone trigger that resurfaces it.
usage: the planning loop reaches Settle and a decision is deferred or an idea parked rather than made now, so it needs a durable owed-and-when record.

sections:
  - id: entries
    repeatable:
      id-from: title
      block:
        - { id: title, type: string }
        - { id: kind, type: enum, of: [D, I] }
        - { id: trigger, type: string }
        - { id: date, type: date, set: on-create }
        - { id: body, slot: { hint: "What is owed and why it was deferred — the decision or parked idea, in prose." } }
