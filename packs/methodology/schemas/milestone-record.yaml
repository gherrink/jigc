# milestone-record — the methodology pack's PER-MILESTONE team-ready state record
# (M39 Increment 3). The continuation state a teammate (or a fresh agent session)
# resumes from — the milestone's shared base-SHA pin, its ordered sub-task list, and
# each sub-task's intent + status — graduated OUT of the gitignored `.jigc/` workbench
# into a committed, managed, legible doctype (design/team-ready-state.md → The
# milestone-record doctype). The committed `.md` is the source of truth;
# `.jigc/milestones/<id>/{base,tasks}.json` is demoted to a rebuildable cache.
#
# NOT a singleton and NOT `id-from: title`-slugged: `id-from: title` names the H1 the
# CLI supplies at create, but the slug IS the milestone work-unit id (CLI-supplied, not
# title-slugified) — so `milestone-record:cache-rework` names the record for work-unit
# `milestone:cache-rework` (the completion-record mint precedent). Flat home
# `location: milestone-records/` (the completion-record `completions/` sibling; under
# the composed `[dev ▸ methodology]` cascade `docs-root` applies → `docs/`).
#
# It carries NO LLM-authored prose slot — every leaf is machine-maintained structured
# state (the settled pure-machine-maintained fork). The `meta` header pairs the `base`
# SHA pin (materialized `set: on-create`) with the `status` (active/joined/discarded,
# materialized `set: on-transition` — the M39 seam). A repeatable `tasks` section records
# one item per sub-task: `task-id` (the item `id-from`, a plain STRING — not a managed
# `ref`: a `task` is a work-unit, `ref-resolves` cannot walk it, the
# `deferral-ledger.trigger` precedent), `intent`, and a per-item `status`, all
# CLI-materialized (so all non-author-required — `set:`-bearing).
#
# SCHEMA-VERSION 2 (M42 Inc 7) — the `status` enum WIDENS to `[active, joined, discarded]`
# at BOTH loci (the header and the `tasks` item block). M39 pinned the lifecycle as
# active → joined, which is the *finalize* path only: an ABANDONED milestone had no
# terminal value to flip to, so its committed record stayed `active` forever and lied
# about in-flight work (`design/team-ready-state.md` → The lifecycle — active / joined /
# discarded). A widening is a byte no-op on the corpus (`EnumWidened` — no committed value
# changes meaning), so the frozen bump's migration only moves the stamp; the prior shape
# is `schema-snapshots/milestone-record.v1.yaml`.
#
# SCHEMA-VERSION 3 (M49 Inc 9) — the `tasks` item block gains a per-sub-task `workflow`
# leaf. Which workflow a sub-task was minted against lived ONLY in the gitignored
# `.jigc/` workbench, so the recorded workflow was NOT fresh-clone durable — and a guard
# that compares recorded workflows then asserts provenance it cannot see, with full
# confidence. The record is the fresh-clone continuation state, so the workflow belongs
# in it. Machine-maintained like every other leaf here (`set: on-transition`), so it is
# not author-required, `set-field` refuses it (the M45 settability rule), and the bump
# costs a committed record ZERO bytes: the diff classifies `AddedItemField`, and a
# `default`-less, non-author-required leaf folds to the source unchanged, so the
# migration moves only the stamp. The prior shape is
# `schema-snapshots/milestone-record.v2.yaml` — this doctype's SECOND snapshot, and the
# store's first two-snapshot chain.
#
# Section ids are SINGLE WORDS ONLY (`meta`/`tasks`): a multi-word id trips the logged
# title-case reparse defect, deferred — this routes around it exactly as
# completion-record did. Manifest-FROZEN since M40 A1 (the methodology
# schema-manifest.yaml; version-gated like the dev pack). Engine-native types only. See
# design/team-ready-state.md; design/methodology-docs.md.
type: milestone-record
location: milestone-records/
id-from: title
description: The per-milestone team-ready state record — the shared base-SHA pin, the ordered sub-task list, and each sub-task's intent and status, resumable from a fresh clone.
usage: a milestone is executing and its in-flight state (base, sub-tasks, statuses) must be committed and legible so a teammate or fresh session can continue it, not stranded in the gitignored workbench.

sections:
  - id: meta
    header: true
    fields:
      - { id: base, type: string, set: on-create }
      - { id: status, type: enum, of: [active, joined, discarded], set: on-transition }
  - id: tasks
    repeatable:
      id-from: task-id
      block:
        - { id: task-id, type: string, set: on-transition }
        - { id: intent, type: string, set: on-transition }
        - { id: workflow, type: string, set: on-transition }
        - { id: status, type: enum, of: [active, joined, discarded], set: on-transition }
