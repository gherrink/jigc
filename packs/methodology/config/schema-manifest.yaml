# schema-manifest.yaml — the methodology pack's frozen v1 doctype-set manifest
# (M40 A1; design/corpus-migration.md → M40 revises the dichotomy).
#
# The versioned/hashed declaration that ends the methodology pack's freeze
# exemption: the engine recomputes each shipped doctype's schema-hash (blake3 of
# its canonical JSON, stamp injected for the persisted set) and requires it to
# match the entry here, with the declared set and the shipped set exactly equal.
# A methodology schema-shape change that bumps no version — or a doctype
# added/removed without touching this file — fails LOUDLY at pack-load / build
# time, not at review. The recorded precondition (hash-freezing a shape never
# proven byte-stable would be premature; implementation/doctype-map.md → the
# scope pin) is discharged by the M40 methodology `arb_doc()` byte-stability
# census, landed before this manifest.
#
# v1 frozen set = all TEN shipped methodology schemas: the nine persisted
# work-doc/design-altitude doctypes (stamp-injected, migrate-corpus-owned —
# `jigc relocate` now refuses them) plus the transient `commit` shadow (listed
# for the strict set-equality assert, stamp-excluded: no `location:`/`placement:`).
# `schema-snapshots/` was ABSENT at v1 and is first populated by the M41 F4
# `deferral-ledger` v1→v2 rename (the D/I → Decision/Idea enum-member remap — the
# first methodology v1→v2 bump; `schema-snapshots/deferral-ledger.v1.yaml` sources it).
# It gains its second entry at the M42 `milestone-record` v1→v2 lifecycle bump (the
# `status` enum widened to admit `discarded` at both loci — an `EnumWidened` pair, so the
# migration moves only the stamp; `schema-snapshots/milestone-record.v1.yaml` sources it),
# and its THIRD at the M49 `completion-record` v1→v2 audit-vocabulary bump (`severity`
# widened to the superset `[blocking, advisory, HIGH, MEDIUM, LOW]` PLUS an optional
# `detail` prose slot on the findings item block — an `EnumWidened` + `AddedItemSlot`
# pair, both byte no-ops, so that migration moves only the stamp too;
# `schema-snapshots/completion-record.v1.yaml` sources it), and its FOURTH at the M49
# `milestone-record` v2→v3 durability bump (a per-sub-task `workflow` leaf joins the
# `tasks` item block, so the recorded workflow becomes fresh-clone durable — an
# `AddedItemField` for a `default`-less, machine-maintained leaf, a byte no-op, so that
# migration moves only the stamp too; `schema-snapshots/milestone-record.v2.yaml` sources
# it). That fourth entry is the store's FIRST second snapshot for one doctype: a
# below-version doc diffs against the snapshot at ITS OWN stamp, so a v1-stamped record
# still sources `.v1.yaml` while a v2-stamped one sources `.v2.yaml`, while the store
# sweep's managed-vs-foreign classifier reads the whole `1..current` set.
#
# `schema-version` is the doctype's own version (v1 at the freeze); `schema-hash`
# is engine::manifest::schema_hash of its resolved definition. Regenerate a hash
# only alongside a deliberate, versioned schema change — never to silence this
# gate.
#
# THE HASH IS A PRESENTATION PROJECTION (M47). schema_hash digests the schema with
# three AUTHORED-PROSE keys erased — `description:`, `usage:`, and every slot `hint:`
# (both loci, nested repeatables included) — so rewording one of them needs NO bump
# and NO re-pin here. Everything else stays in, the six SEMANTICS keys included
# (`default` / `set` / `inverse` / `inverse-card` / `check` / `title-names-symbol`):
# they change what the tool WRITES and ADJUDICATES, so they remain declared contract
# changes. While prose sat inside the hash the freeze was unfenceable — a hint reword
# and an enum widening were the same keystroke, guarded only by the line above
# (design/corpus-migration.md → The freeze).
#
# THE SUCCESSOR RULE, stated forward from M47 Increment 1 and FENCED since M48
# Increment 11: a SCHEMA-SHAPE change moves a doctype's `schema-hash` only together
# with its `schema-version`, and a SLUG-RULE change moves `slug-rule.hash` only
# together with `slug-rule.version`.
#
# The fence fires in CI, over the pushed range — BOTH shipped manifests, this one
# included, read at the base of that range and at its tip, failing on any entity whose
# hash moved while its co-located version stood still. It is not a pack-load assert:
# pack-load still only recomputes each hash against the shipped schema, and one state
# of the tree cannot tell a legitimate re-pin from a silent breach. A legitimate re-pin
# declares itself per entity, on the commit that does it —
#
#     Manifest-Repin: <doctype | slug-rule>
#
# — never blanket: a blanket escape would restore "re-pin the hash" as one keystroke
# with two meanings, merely renamed. M47 Increment 1 is the declared genesis exemption
# and the ONLY one: the narrowing re-pinned all 16 doctype hashes at unchanged
# schema-versions BY CONSTRUCTION — no schema's shape moved, only what the hash is
# computed over. It predates the fence, and is now the fixture that proves it fires
# (crates/cli/tests/manifest_freeze_fence.rs).
#
# TWO DECLARED BOUNDS, recorded rather than glossed: the fence protects this repo only,
# not adopters (it lives in this repo's CI, and this repo is the only party that edits
# a manifest), and it is a build fence, not a surface — it mints no finding code, no
# route and no verb. The two other candidate mechanisms stay refused: an append-only
# (type, version) -> hash ledger asserted at pack-load would protect adopters too, but
# it is a new stored format; and the successor rule as an in-process check is
# unimplementable in-process, since a pack-load assert cannot observe a CHANGE without
# a recorded prior (design/corpus-migration.md → The freeze; M48 settle-record).
#
# `slug-rule` (M42) declares the IDENTITY-MINT rule — engine::slug::slugify — the ids
# inside every doctype above are derived by. It is the SAME rule for every pack (it
# lives in the engine), so both shipped manifests pin the same version + hash and a
# rule change re-pins both, in one commit, alongside its slug-rule-version bump. The
# gate is per-manifest, so a stale copy here blocks every door on its own
# (design/storage.md → Identity → The slug rule is itself a versioned rule).
