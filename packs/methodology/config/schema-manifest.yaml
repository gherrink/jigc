# schema-manifest.yaml — the methodology pack's frozen v1 doctype-set manifest
# (M40 A1; design/corpus-migration.md → M40 revises the dichotomy).
#
# The versioned/hashed declaration that ends the methodology pack's freeze
# exemption: the engine recomputes each shipped doctype's schema-hash (blake3 of
# its canonical JSON, stamp injected for the persisted set) and requires it to
# match the entry here, with the declared set and the shipped set exactly equal.
# A methodology schema-shape change that bumps no version — or a doctype
# added/removed without touching this file — fails LOUDLY at pack-load / build
# time, not at review. The recorded precondition (hash-freezing a shape never
# proven byte-stable would be premature; implementation/doctype-map.md → the
# scope pin) is discharged by the M40 methodology `arb_doc()` byte-stability
# census, landed before this manifest.
#
# v1 frozen set = all TEN shipped methodology schemas: the nine persisted
# work-doc/design-altitude doctypes (stamp-injected, migrate-corpus-owned —
# `jigc relocate` now refuses them) plus the transient `commit` shadow (listed
# for the strict set-equality assert, stamp-excluded: no `location:`/`placement:`).
# `schema-snapshots/` was ABSENT at v1 and is first populated by the M41 F4
# `deferral-ledger` v1→v2 rename (the D/I → Decision/Idea enum-member remap — the
# first methodology v1→v2 bump; `schema-snapshots/deferral-ledger.v1.yaml` sources it).
# It gains its second entry at the M42 `milestone-record` v1→v2 lifecycle bump (the
# `status` enum widened to admit `discarded` at both loci — an `EnumWidened` pair, so the
# migration moves only the stamp; `schema-snapshots/milestone-record.v1.yaml` sources it).
#
# `schema-version` is the doctype's own version (v1 at the freeze); `schema-hash`
# is engine::manifest::schema_hash of its resolved definition. Regenerate a hash
# only alongside a deliberate, versioned schema change — never to silence this
# gate.
