Migrate the foreign milestone-close record into a managed per-milestone
`completion-record`. Below is the foreign source the CLI staged for you (read-only
context — you author the canonical record through the write verbs, you never edit
this file or place anything yourself):

{{ source }}

FIRST, the refusal rung: a completion record RECORDS A CLOSE, so it needs a
derivable verdict. When the foreign document states NO outcome at all — nothing
done/shipped/passed-shaped and nothing failed/blocked-shaped — it is NOT a
completion record: author nothing, run `jigc task discard {{task.id}} --force`, and
either leave the file unmanaged or re-run `jigc migrate <path> --as <doctype>` with
the doctype it actually is (the consent is required because a migrate task stages
its `commit:<id>` doc at mint). There is NO rung that fabricates a verdict.

Otherwise the target schema and its batch payload, both generated from the resolved
`completion-record` schema, follow — the CLI creates the per-milestone record (the
slug is minted from the title: the milestone this record closes) and places its
header fields and findings over a single staged buffer:

{{ schema:completion-record }}

Map the `verdict` mechanically: the foreign record closes the milestone clean
(done / shipped / accepted / all criteria met) → `green`; it records the close with
unresolved blockers or a failed audit → `red`. Neither derivable → that is the
refusal rung above, never a guess.

The `owner-artifact` is REQUIRED and finalize BLOCKS unless the file it names is
present AND staged — the presence gate carries no migration carve-out. Resolve it by
this ladder, FIRST rung that applies wins:

  1. POINT AT EXISTING — evidence for this milestone already lives under the owned
     home `completions/artifacts/<milestone>/`: set `owner-artifact` to that
     existing path; copy nothing.
  2. COPY UNDER THE HOME — the evidence exists elsewhere in the repo (a report, a
     verdict file, a test log the foreign record names): copy it under the owned
     home and stage it, then point at the copy:

       mkdir -p completions/artifacts/<milestone>
       cp <the-evidence-file> completions/artifacts/<milestone>/
       git add completions/artifacts/<milestone>/

  3. THE SOURCE IS THE ARTIFACT — NO evidence file exists anywhere: the verbatim
     foreign record itself is the milestone's only surviving evidence. Copy IT under
     the owned home BEFORE you finalize — finalize retires the foreign original, so
     an uncopied source is gone:

       mkdir -p completions/artifacts/<milestone>
       cp <the-foreign-source-path> completions/artifacts/<milestone>/source.md
       git add completions/artifacts/<milestone>/source.md

     then set `owner-artifact: completions/artifacts/<milestone>/source.md`.

Each foreign finding maps onto one `findings` item: `severity` carries the foreign
record's OWN grade when it graded one — `HIGH` / `MEDIUM` / `LOW` ride verbatim —
and otherwise it is `blocking` when the foreign record treated the finding as
must-fix, `advisory` when it did not; `disposition` is `fixed` / `deferred` /
`contested` off the foreign record's own resolution (an unresolved-but-accepted
finding is `deferred`); `evidence` is a plain STRING (the file:line, repro, or trace
as recorded) — never a managed ref, and a foreign reference to a document that is
not in the store stays prose inside that string.

The optional `detail` slot takes the foreign record's own prose about that finding
when it wrote a paragraph the one-line `evidence` cannot hold; leave it unfilled
otherwise.

When the foreign record states its outcome but records NO findings, author no
`findings` items — omit that entry entirely.

`<slug>` is the slug the title minted, and this task's own index names it back —
every doc the task stages, each by the `<type>:<slug>` identity the read takes:

jigc doc list completion-record --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show completion-record:<slug> --task {{task.id}}
