Migrate the foreign milestone-close record into a managed per-milestone
`completion-record` at `completions/`. Below is the foreign source the CLI staged for
you (read-only context — you author the canonical record through the write verbs,
you never edit this file or place anything yourself):

{{ source }}

FIRST, the refusal rung: a completion record RECORDS A CLOSE, so it needs a
derivable verdict. When the foreign document states NO outcome at all — nothing
done/shipped/passed-shaped and nothing failed/blocked-shaped — it is NOT a
completion record: author nothing, run `jigc task discard {{task.id}}`, and either
leave the file unmanaged or re-run `jigc migrate <path> --as <doctype>` with the
doctype it actually is. There is NO rung that fabricates a verdict.

Otherwise author the WHOLE canonical record in ONE declarative batch payload — the
CLI creates the per-milestone record (the slug is minted from the title: the
milestone this record closes) and places its header fields and findings over a
single staged buffer. Pipe the payload on stdin:

jigc doc author completion-record --from-file - --task {{task.id}} <<'EOF'
title: "<milestone>"
sections:
  - id: meta
    set:
      verdict: "<green-or-red>"   # the verdict mapping below
      owner-artifact: "completions/artifacts/<milestone>/<file>"  # the artifact ladder below
  - id: findings
    items:
      - title: "<the finding>"    # one item per foreign audit/review finding; when the source records none, author no items
        set:
          severity: "<blocking-or-advisory>"
          disposition: "<fixed-or-deferred-or-contested>"
          evidence: "<the file:line, repro, or trace, as recorded — a plain string>"
EOF

EVERY `set:` value in this payload is an inline FIELD (`verdict`, `owner-artifact`,
`severity`, `disposition`, `evidence`) — bare values, no `<<…>>` markers; wrapping
one is rejected. The `title` values are bare too.

Map the `verdict` mechanically: the foreign record closes the milestone clean
(done / shipped / accepted / all criteria met) → `green`; it records the close with
unresolved blockers or a failed audit → `red`. Neither derivable → that is the
refusal rung above, never a guess.

The `owner-artifact` is REQUIRED and finalize BLOCKS unless the file it names is
present AND staged — the presence gate carries no migration carve-out. Resolve it by
this ladder, FIRST rung that applies wins:

  1. POINT AT EXISTING — evidence for this milestone already lives under the owned
     home `completions/artifacts/<milestone>/`: set `owner-artifact` to that
     existing path; copy nothing.
  2. COPY UNDER THE HOME — the evidence exists elsewhere in the repo (a report, a
     verdict file, a test log the foreign record names): copy it under the owned
     home and stage it, then point at the copy:

       mkdir -p completions/artifacts/<milestone>
       cp <the-evidence-file> completions/artifacts/<milestone>/
       git add completions/artifacts/<milestone>/

  3. THE SOURCE IS THE ARTIFACT — NO evidence file exists anywhere: the verbatim
     foreign record itself is the milestone's only surviving evidence. Copy IT under
     the owned home BEFORE you finalize — finalize retires the foreign original, so
     an uncopied source is gone:

       mkdir -p completions/artifacts/<milestone>
       cp <the-foreign-source-path> completions/artifacts/<milestone>/source.md
       git add completions/artifacts/<milestone>/source.md

     then set `owner-artifact: completions/artifacts/<milestone>/source.md`.

Each foreign finding maps onto one `findings` item: `severity` is `blocking` when
the foreign record treated it as must-fix, `advisory` otherwise; `disposition` is
`fixed` / `deferred` / `contested` off the foreign record's own resolution (an
unresolved-but-accepted finding is `deferred`); `evidence` is a plain STRING (the
file:line, repro, or trace as recorded) — never a managed ref, and a foreign
reference to a document that is not in the store stays prose inside that string.
