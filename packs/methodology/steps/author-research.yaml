---
states-constraints: [read.staged-read-back]
---
Record the investigation on a fresh research doc. Create it — the slug is minted
from the title you give (the question this investigation answers):

{{ cli.create-research }}

The `research` schema is the authority on what you write into it — its required
slots and fields, each field's enum members, and every address a write can take:

jigc doc schema research

Author the three prose slots — the question it set out to answer, what the evidence
showed, and where that evidence came from. The `date` is CLI-set on create:

jigc doc set-slot research:<slug>#question --from-file - --task {{task.id}}
jigc doc set-slot research:<slug>#findings --from-file - --task {{task.id}}
jigc doc set-slot research:<slug>#sources --from-file - --task {{task.id}}

Or make it one call — the batch alternative to the whole sequence above (run it
instead of the create + per-leaf verbs, or after them — the create it implies
over a doc this task already staged acks `already existed — copied in for
update` and changes nothing): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every leaf in a single
write; the payload's `title:` mints the slug exactly like the create above:

jigc doc author research --from-file - --task {{task.id}}

`<slug>` is the slug the title minted, and this task's own index names it back —
every doc the task stages, each by the `<type>:<slug>` identity the read takes:

jigc doc list research --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show research:<slug> --task {{task.id}}
