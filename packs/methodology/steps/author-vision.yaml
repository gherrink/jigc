---
states-constraints: [read.staged-read-back]
---
<!-- research-advisory -->
No committed research exists yet — a vision grounds in the research it cites, so consider running `do-research` first to gather it. Do that in a separate task and come back: leave this task open, finalize the research, then re-compose here with `jigc start --task {{task.id}}` — the research you just committed is in view from there. (Advisory, not required: a vision may ground in experience, and grounding can take several research rounds.)
<!-- /research-advisory -->
Form the project vision on the `vision` singleton. Create it — this is
safe whether or not it already exists (an existing committed vision is copied in
for revise). The slug is fixed (`vision`), and its H1 reads `# Vision` regardless
of the title:

{{ cli.create-vision }}

The `vision` schema is the authority on what you write into it — its required
slots and fields, each field's enum members, and every address a write can take:

jigc doc schema vision

Ground the vision in the committed research it rests on. Set `grounded-in` to the
research this vision is formed from — pass ALL of it in ONE call as an inline list
(the multi-value path). Every element is recorded and resolved at finalize:

jigc doc set-field vision:vision#meta/grounded-in --value "[research:<slug>, …]" --task {{task.id}}

Now RE-COMPOSE so the grounding research comes into view — the findings below
resolve only after `grounded-in` is set. The same call is the way back in when the
grounding research was committed in a separate task while this one stayed open: a
commit that landed elsewhere re-pins this task, as long as its paths are disjoint
from this task's own:

jigc start --task {{task.id}}

The findings of ALL grounding research appear here for reference (nothing appears
until you set `grounded-in` and re-compose; with multiple grounding sources each
one renders under its own labelled `> **type:slug**` blockquote):
{{ @task.vision.grounded-in#findings }}

Author the three prose slots — the core claim, the invariants it holds, and the
questions it leaves open:

jigc doc set-slot vision:vision#thesis --from-file - --task {{task.id}}
jigc doc set-slot vision:vision#invariants --from-file - --task {{task.id}}
jigc doc set-slot vision:vision#open-questions --from-file - --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show vision:vision --task {{task.id}}
