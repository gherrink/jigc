Validate the increment against the roadmap — an independent, read-only check run
by an agent that did not build it and cannot edit or commit, so it cannot certify
its own work. It returns findings; it does not repair them. Verify, with concrete
evidence: the gate is green from a clean state; the deliverable holds end-to-end
by running the real binary and observing output, not by trusting the tests alone;
the increment proves what the roadmap says it proves; the invariants are honored;
and the scope is honest — no inert feature, no stub presented as done, no creep
into a later increment.

Return findings, each blocking (the deliverable, proves, invariants, or scope
are not genuinely met) or advisory (real but non-blocking).
