Record the measured run on the per-run dogfood-record. Create it fresh — the slug
is minted from the title you give (this run):

{{ cli.create-dogfood-record }}

Set the run identity — the `case` this run exercises and the sha of the pinned
binary it ran against:

jigc doc set-field dogfood-record:<slug>#meta/case --value <pilot|existing-docs|greenfield> --task {{task.id}}
jigc doc set-field dogfood-record:<slug>#meta/binary-sha --value <sha> --task {{task.id}}

Transcribe the eight ORGANIC fact counts from the committed capture (the hook
log + the tally output). The honesty bound is typed-but-transcribed: collection
is mechanical, the form is engine-validated, the transcription is yours — and it
is auditable against the committed hook log. Transcribe the tally's numbers
verbatim; never estimate or round:

jigc doc set-field dogfood-record:<slug>#meta/adapter-writes --value <n> --task {{task.id}}
jigc doc set-field dogfood-record:<slug>#meta/oob-edits --value <n> --task {{task.id}}
jigc doc set-field dogfood-record:<slug>#meta/drift-caught --value <n> --task {{task.id}}
jigc doc set-field dogfood-record:<slug>#meta/validate-blocks --value <n> --task {{task.id}}
jigc doc set-field dogfood-record:<slug>#meta/halts-expected --value <n> --task {{task.id}}
jigc doc set-field dogfood-record:<slug>#meta/halts-unplanned --value <n> --task {{task.id}}
jigc doc set-field dogfood-record:<slug>#meta/fix-rounds --value <n> --task {{task.id}}
jigc doc set-field dogfood-record:<slug>#meta/audit-findings --value <n> --task {{task.id}}

Record the two SEEDED instrument checks separately — seeds validate the
instrument, never the thesis, and they never enter the organic facts above (each
must be exactly 1; any other count fails the run, whatever its other numbers
say):

jigc doc set-field dogfood-record:<slug>#meta/seeded-oob --value <n> --task {{task.id}}
jigc doc set-field dogfood-record:<slug>#meta/seeded-blocks --value <n> --task {{task.id}}

Set the judged `verdict` (green/red) and the `owner-artifact`: the repo-relative
path to the run's capture — the session transcript, the raw hook log and tally
output exported unchanged, and a manifest with their content hashes. That path
MUST live under the owned artifact home `completions/artifacts/<run>/` — write
the artifact file there, then name it here. finalize promotes that file in the
same transaction and the presence gate asserts it is durably staged (it never
reads the artifact's bytes — presence, not content):

jigc doc set-field dogfood-record:<slug>#meta/verdict --value <green|red> --task {{task.id}}
jigc doc set-field dogfood-record:<slug>#meta/owner-artifact --value completions/artifacts/<run>/<file> --task {{task.id}}

Then author the judgment — what the counts mean, where the loop held or
strained, what the verdict rests on, and what this run did NOT test. The verdict
is authored judgment over the counts, never computed:

jigc doc set-slot dogfood-record:<slug>#judgment --from-file - --task {{task.id}}

Or make it one call — the batch alternative to the whole sequence above (run it
INSTEAD of the create + per-leaf verbs, never after them — an already-staged doc
rejects a second create): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every leaf in a single
write; the payload's `title:` mints the slug exactly like the create above. The
transcribe-verbatim and seeded-vs-organic bounds above bind unchanged:

jigc doc author dogfood-record --from-file - --task {{task.id}}
