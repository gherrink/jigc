---
states-constraints: [read.staged-read-back]
---
Record the milestone you decomposed on the running roadmap. Create-or-update the
roadmap singleton — safe whether or not it already exists (an existing committed
roadmap is copied in for append):

{{ cli.create-roadmap }}

The `roadmap` schema is the authority on what you write into it — its required
slots and fields, each field's enum members, and every address a write can take:

jigc doc schema roadmap

Every `--from-file -` below reads its payload from stdin — attach it as a heredoc
directly to the `jigc` command, never as a `cat payload | jigc …` pipeline, which
jigc itself accepts but an agent harness that statically analyses shell commands
can refuse to run:

jigc doc set-slot roadmap:roadmap#milestones/<id>/proves --from-file - --task {{task.id}} <<'EOF'
<what this milestone proves>
EOF

Then mint this milestone's entry and author it — its `proves` and the prose
`decomposition` of its increments (one level: each increment's deliverable and the
tasks that build it, as prose). The item id is minted from the title you give:

jigc doc add-item roadmap:roadmap#milestones --title "<milestone>" --task {{task.id}}
jigc doc set-slot roadmap:roadmap#milestones/<id>/proves --from-file - --task {{task.id}}
jigc doc set-slot roadmap:roadmap#milestones/<id>/decomposition --from-file - --task {{task.id}}

<!-- once:batch-author-note -->
Or make it one call — the batch alternative to the whole sequence above (run it
instead of the create + per-entry verbs, or after them — the create it implies
over a doc this task already staged acks `already existed — copied in for
update` and changes nothing): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every entry in a single
write. Over an already-committed roadmap it copies the committed doc in and
appends the new milestone — existing entries are untouched; an entry whose title
mints an id the roadmap already holds is refused (`write.already-present`), the
WHOLE payload rejected and nothing staged, so edit that milestone in place with
the per-entry `set-slot` lines above rather than re-authoring it here:
<!-- /once -->

jigc doc author roadmap --from-file - --task {{task.id}}

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show roadmap:roadmap --task {{task.id}}
