If this task made a design decision worth keeping — a choice with a rationale a
future reader would otherwise have to reverse-engineer — record it on the running
decisions log. (A task that decided nothing of consequence skips this step.)
Create-or-update the log singleton — safe whether or not it already exists (an
existing committed log is copied in for append):

{{ cli.create-log }}

Mint one entry per decision and author its `why` — the reasoning, in a sentence
or two; the `date` is CLI-set on create. Inside slot prose, the reserved heading
depths are schema-relative to the address you write — the CLI owns the section,
item, and sub-label heading levels there, so your headings sit below them; Setext
headings are rejected at every depth, and a rejected write names the shallowest
depth free at that address.

jigc doc add-item decisions-log:decisions-log#entries --title "<the decision>" --task {{task.id}}
jigc doc set-slot decisions-log:decisions-log#entries/<id>/why --from-file - --task {{task.id}}

Or make it one call — the batch alternative to the whole sequence above (run it
INSTEAD of the create + per-entry verbs, never after them — an already-staged doc
rejects a second create): the batch verb reads one declarative payload from
stdin (grammar: `jigc doc author --help`) and places every entry in a single
write. Over an already-committed log it copies the committed doc in and appends —
existing entries are untouched; an entry whose title mints an id the log already
holds is refused (`write.already-present`), the WHOLE payload rejected and
nothing staged, so edit that entry in place with the per-entry `set-slot` line
above rather than re-authoring it here:

jigc doc author decisions-log --from-file - --task {{task.id}}
