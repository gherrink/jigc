Migrate the foreign decisions log into the managed `decisions-log` singleton — the
running log of decisions made. Below is the foreign source the CLI staged for you
(read-only context — you author the canonical record through the write verbs, you
never edit this file or place anything yourself):

{{ source }}

The target schema and its batch payload, both generated from the resolved
`decisions-log` schema, follow — the CLI creates the fixed-slug singleton (the
`title: Decisions Log` line stays exactly as written; the CLI owns the placement) and
mints every entry over a single staged buffer:

{{ schema:decisions-log }}

If a `decisions-log` is ALREADY committed in the store (a re-run, or one adopted
earlier), the CLI does not mint a fresh one — it copies the committed body in as
your edit base, so the entries you author below APPEND to those already there and
any slot you set overwrites. Re-author only what the foreign source adds; an entry
whose title mints an id the committed doc already holds is refused
(`write.already-present`), the WHOLE payload rejected and nothing staged, so edit that
entry in place with `jigc doc set-slot` rather than re-authoring it here. The lone
exception is a same-path
migration — when the foreign file you are migrating IS the canonical `decisions-log`
home the schema line above names — where the CLI seeds a blank skeleton and your
authoring rebuilds the whole doc.

Re-author every DECISION from the foreign log, oldest first, as one item under
`entries`, titled with the decision itself (strip a leading date from a foreign
heading — the date belongs in the `date` field, never the title).

Decide the `date` PER ENTRY, mechanically — never once for the whole file:

  - THIS entry carries a date in the foreign source → TRANSCRIBE it: add
    `date: "<YYYY-MM-DD>"` to that entry's `set:` map, exactly as it appears in the
    source — an authored date overwrites the CLI's on-create stamp;
  - THIS entry carries NO date → OMIT the `date` key for that entry. In migration
    the CLI does NOT stamp today's date, so a dateless entry renders dateless — no
    false history. Never fill a gap with today, and never copy a neighbouring
    entry's date.

Fill `why` from the foreign entry's rationale. When the foreign entry records the
call but preserves no reasoning, transcribe its stated intent and say so ("as
recorded; the source preserved no rationale") — never invent a reason.

A foreign cross-reference (an ADR number, an issue link) stays plain prose inside the
`why` slot — the decisions-log schema declares no managed ref, so never invent a
field for it. Foreign preamble with no entry home is dropped.

Read your write back before you move on — with `--task` the read serves THIS
task's staged copy, the write you just made, which the committed store does not
carry yet:

jigc doc show decisions-log:decisions-log --task {{task.id}}
