If a `deferral-ledger` is ALREADY committed in the store (a re-run, or one adopted
earlier), the CLI does not mint a fresh one — it copies the committed body in as
your edit base, so the entries you author below APPEND to those already there and
any slot you set overwrites. Re-author only what the foreign source adds; an entry
the committed doc already holds would double. The lone exception is a same-path
migration — when the foreign file you are migrating IS the canonical
`docs/deferral-ledger.md` — where the CLI seeds a blank skeleton and your authoring
rebuilds the whole doc.

Re-author every DEFERRAL from the foreign record, oldest first, as one item under
`entries`. Fill its fields mechanically:

  - `kind` — map by what the entry holds open: the foreign entry defers a CHOICE (a
    decision consciously not made yet — an open fork, a "decide X when Y") →
    `Decision`; the foreign entry parks a THING (an idea, direction, or feature kept
    for later) → `Idea`. A value outside the enum the schema above lists is rejected
    at the write.
  - `trigger` is REQUIRED — what resurfaces this entry. The foreign entry names a
    resurface condition or trigger milestone → transcribe it; it names NONE → derive
    the trigger from the entry's own subject ("a concrete need for <the subject>
    shows up") — never leave `trigger` out.
  - Decide the `date` PER ENTRY, mechanically: THIS entry carries a date in the
    foreign source → TRANSCRIBE it — add `date: "<YYYY-MM-DD>"` to that entry's
    `set:` map, exactly as it appears in the source (an authored date overwrites the
    CLI's on-create stamp); THIS entry carries NO date → OMIT the `date` key for
    that entry. In migration the CLI does NOT stamp today's date, so a dateless
    entry renders dateless — no false history. Never fill a gap with today.

Everything else the foreign entry says — the rationale, the caveats — folds into the
`body` prose. A foreign cross-reference stays plain prose inside `body` — the
deferral-ledger schema declares no managed ref, so never invent a field for it.
Foreign preamble with no entry home is dropped.
