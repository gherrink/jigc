# cargo-nextest configuration — the test runner `dev/gate` uses.
#
# **nextest is the gate's test step** (since 2026-10-02; `implementation/dev-workflow.md`
# → Gate): `dev/gate` runs `cargo nextest run --workspace --no-fail-fast` and then
# `cargo test --workspace --doc`, because nextest does not run doctests, so the two
# together are the full suite. Where nextest is not installed, `dev/gate` runs
# `cargo test` instead and says so; install it with `cargo install cargo-nextest --locked`
# (`implementation/machine-setup.md`). CI does not use nextest: each `[[test]]` group is
# its own `cargo test` leg (`.github/workflows/ci.yml`).
#
# **Why it is the gate now, when this file used to say it must not be.** Until M54 about
# thirty suites shelled out to cargo to build the detached `doc-code` probe workspace, all
# into one `target/`, and nextest's process-per-test pool made those builds concurrent: a
# run died on `anchor_root_truth` with *"`doc-code` probe not found"* while another suite
# was mid-rebuild. M54 moved the probe into the `jigc` binary (self-exec), so no suite
# builds a probe and nothing is left to race on. Measured on 2026-10-02, all 4222 of the
# suite's tests ran under nextest in every row of
# `completions/artifacts/M55/gate-speed-measurement.md`, and nextest alone made a full
# gate 9 % faster.

[profile.default]
# Most tests drive the real binary through git in a throwaway repo, so they idle far more
# than they compute; oversubscribing the 10 cores keeps the pool full.
test-threads = 16

# A suite that drives the binary through a full migration legitimately runs for a while;
# only shout about the genuinely pathological ones.
slow-timeout = { period = "60s", terminate-after = 8 }

status-level = "fail"
final-status-level = "slow"

[profile.ci]
fail-fast = false
