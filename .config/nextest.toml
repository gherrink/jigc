# cargo-nextest configuration — the test runner `dev/gate` uses.
#
# **nextest is the gate's test step** (since 2026-10-02; `implementation/dev-workflow.md`
# → Gate): `dev/gate` runs the suite as two `cargo nextest run --workspace --no-fail-fast`
# runs — a fast tier and then its complement (since 2026-10-05) — and then
# `cargo test --workspace --doc`, because nextest does not run doctests, so the three
# together are the full suite. Where nextest is not installed, `dev/gate` runs
# `cargo test` instead and says so; install it with `cargo install cargo-nextest --locked`
# (`implementation/machine-setup.md`). CI does not use nextest: each `[[test]]` group is
# its own `cargo test` leg (`.github/workflows/ci.yml`).
#
# **The gate's two tiers are not in this file.** `dev/gate` writes them per run, as the
# profiles `gate-tier1` and `gate-tier2` of a tool config it hands nextest
# (`--tool-config-file`): each is a `default-filter` derived from the last run's timings
# plus a JUnit report. Both inherit `[profile.default]` below, so what is set there is
# what the gate runs under. A gate that keeps going (`dev/gate --keep-going`) has no tiers:
# it writes one profile, `gate-all`, whose filter is every test, and makes one run.
#
# **Why it is the gate now, when this file used to say it must not be.** Until M54 about
# thirty suites shelled out to cargo to build the detached `doc-code` probe workspace, all
# into one `target/`, and nextest's process-per-test pool made those builds concurrent: a
# run died on `anchor_root_truth` with *"`doc-code` probe not found"* while another suite
# was mid-rebuild. M54 moved the probe into the `jigc` binary (self-exec), so no suite
# builds a probe and nothing is left to race on. Measured on 2026-10-02, all 4222 of the
# suite's tests ran under nextest in every row of
# `completions/artifacts/M55/gate-speed-measurement.md`, and nextest alone made a full
# gate 9 % faster.

# **The route catalog's arms that follow cases run one at a time.** Each of them
# (`crates/cli/tests/route_catalog.rs`, one arm a command's file) follows its cases through
# a pool as wide as the machine, every case a chain of child processes — so one arm is one
# machine's worth of work by itself. Inside one process the arms share one gate of that
# width; nextest gives each test a process, so here nothing in the suite can bound two of
# them together without making one wait inside its own `slow-timeout`. A group waits
# before a test is started, which costs the test none of its time. The filter names the
# module the arms stand in, never an arm: the arm of a command's file that is added later
# is in the group the day it is made, and
# `route_catalog::the_arms_that_follow_cases_run_one_at_a_time_under_the_gates_runner`
# holds this file to that. The filter's second term is the one arm that follows every case
# on a binary a variable names: ignored, run by hand, and in the group for the run that
# asks for it beside the others. Under `cargo test` — CI, the runner-faithful container —
# a group's tests are threads of one process and the suite's own gate is the bound.
#
# **The byte table's arms that run cells are in the same group**
# (`crates/cli/tests/byte_table.rs`, one arm a prepared state): each is a pool as wide as
# the machine too, a cell a chain of child processes, so one of them beside an arm of the
# catalog would be two machines' worth. The term names the module they stand in, and
# `byte_table::the_arms_that_run_cells_run_one_at_a_time_under_the_gates_runner` holds this
# file to it — and to the last term, the table's own arm on a binary a variable names,
# which is ignored and runs every cell twice.
[test-groups]
route-catalog-cases = { max-threads = 1 }

[profile.default]
# Most tests drive the real binary through git in a throwaway repo, so they idle far more
# than they compute; oversubscribing the 10 cores keeps the pool full.
test-threads = 16

# A suite that drives the binary through a full migration legitimately runs for a while;
# only shout about the genuinely pathological ones.
slow-timeout = { period = "60s", terminate-after = 8 }

status-level = "fail"
final-status-level = "slow"

# An override stands below every key of its profile: a key written under this header is
# the override's. Overrides of the default profile reach every other profile, the ones
# `dev/gate` writes per run included.
[[profile.default.overrides]]
filter = 'test(/^route_catalog::the_cases_are_followed_and_the_expected_red_list_is_exact::/) | test(=route_catalog::the_cases_are_followed_on_the_binary_a_variable_names) | test(/^byte_table::the_cells_are_run_and_the_expected_red_list_is_exact::/) | test(=byte_table::the_cells_are_run_on_the_binary_a_variable_names)'
test-group = 'route-catalog-cases'

[profile.ci]
fail-fast = false

# A scoped run during red → green — one suite, one test:
#
#     cargo nextest run -p jigc --profile scoped <suite>::
#
# `cargo test` has no per-test timeout, and a test blocked on a FIFO once hung a scoped
# run until the ten-minute tool ceiling. Here such a test is terminated after two minutes
# and reported as `TIMEOUT` by name. The slowest test of the suite runs about 35 s alone
# and 141 s inside a full gate's load, so two minutes is room for any one suite and too
# little for the whole suite at once — which this profile is never for: `dev/gate` does
# not use it, and a scoped green is never a gate (`implementation/dev-workflow.md` → Gate).
[profile.scoped]
slow-timeout = { period = "30s", terminate-after = 4 }
