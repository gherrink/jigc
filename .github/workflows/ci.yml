name: CI

# Internal-only: the four-command dev-workflow gate on every push and PR.
# No external publish (M36 F4) — no crates.io / npm / release step.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: dev-workflow gate
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth-1 snapshot. The manifest-freeze fence's
      # own acceptance is THIS REPO'S HISTORY: `manifest_freeze_fence::historical`
      # replays the window over `6e81d53~1 -> d0b8728` (M47 Increment 1 re-pinned all
      # 16 doctype hashes at unchanged schema-versions, 34 first-parent commits from
      # its push tip) and FAILS — never skips — on a clone that cannot reach them.
      # Cost: 9.89 MiB over 1800 commits (M48 Increment 11).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # rustup honors ./rust-toolchain.toml (channel 1.95.0 + rustfmt, clippy),
      # so the pinned stable toolchain installs on first cargo invocation.
      - name: Show toolchain
        run: cargo --version && rustc --version

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: cargo build

      # No artificial per-test timeout: the flow13 suites shell out to a nested
      # `cargo build` for the doc-code probe (~30s), which must run to completion.
      - name: cargo test
        run: cargo test
