name: CI

# The dev-workflow gate on every push and PR, split into one job per leg so a green
# push reports in <= 15 min of slowest-job wall clock and a red push reports EVERY
# failure (M54 S8; implementation/dev-workflow.md -> Gate). The 15 minutes are a promise
# that is watched, never a bound that is enforced: a part's `timeout-minutes` below may
# pass them. What watches it is the pending row `ci-where-the-time-goes`
# (implementation/decisions-pending.md), whose trigger fires when any leg's hosted time
# reaches 15 minutes, and `dev/ci-runs`, the planned CI-run reader, which reports such a
# leg (the human's ruling of 2026-11-06 on N3: DECISIONS.md -> 2026-11-06, *No absolute
# host path enters the repository, and the fifteen-minute promise is watched*). The union
# of the jobs below is the gate `dev/gate` runs locally in one process:
#
#   hygiene          the public-hygiene guard: the branch-name rule, then gitleaks and
#                    the private denylist over the pushed range, and its built-in
#                    host-path and id rules (implementation/public-hygiene.md)
#   fmt · clippy · build
#   test             one row per `[[test]]` group target — and one row per part (below)
#                    for `g_tooling`, whose one row outgrew a leg, and for `g_migration`,
#                    which the plan before the stabilization run's opening splits
#   unit             the lib and bin unit tests of every workspace member, and doctests
#   manifest-freeze  the CI-only manifest-freeze fence
#   publish-dry-run  `cargo publish --workspace --dry-run`
#   lock-current     `Cargo.lock` is current (`cargo metadata --locked`)
#   ci-ok            the one aggregate: green only when every job above succeeded
#
# No leg `needs` another and the matrix is `fail-fast: false`, so one red leg never
# hides or cancels the rest. Only `ci-ok` waits, on all of them, and it is the one
# check `main`'s ruleset requires (implementation/release.md -> The main branch), so a
# job added here and not to its `needs` reddens tooling-tests/ci_matrix_fence.rs
# instead of going unrequired. Every leg checks out full history, prints `nproc` in its
# `CPU count` step, and is bounded by `timeout-minutes`. A part of a group that runs in
# parts (below) is bounded at max(10, 3 x its measured four-CPU proxy), in whole minutes
# up — the human's ruling of 2026-11-06, where M54 had set 2 x
# (completions/artifacts/M54/ci-runtime.md): DECISIONS.md -> 2026-11-06, *CI's legs
# re-bounded*, whose proxies each part's row carries. A group that runs whole, and every
# other job, keeps the floor of 10 minutes and carries no proxy here; their last measured
# proxies are M54's, in that ci-runtime.md, the largest `g_flow`'s 221 s. The
# `test` matrix is fenced to the targets `cargo metadata` reports
# (tooling-tests/ci_matrix_fence.rs), so a group root added to the manifest and not
# here reddens instead of going unrun, and a group that runs in parts is fenced to run
# whole: every part but one names its suites, and the last skips exactly those.
#
# Nothing here publishes. M36 F4's "internal-only, no external publish" was reversed on
# 2026-09-27 (DECISIONS.md -> the road to the 1.0.0 call, D2), and the only publish
# command in this file is the `--dry-run`. Publishing is the release workflow's alone:
# `release.yml`, behind the human's merge of the release PR and his approval of the
# `release` environment (implementation/release.md -> Publishing).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, not the default depth-1 snapshot, on every job (S8). The
      # manifest-freeze fence's own acceptance is THIS REPO'S HISTORY:
      # `manifest_freeze_fence::historical` (in the `g_finalize` row) replays the window
      # over `2c5eee5~1 -> 7ada302` (M47 Increment 1 re-pinned all 16 doctype hashes at
      # unchanged schema-versions) and FAILS — never skips — on a clone that cannot
      # reach them; the other legs check out the same way, so no leg's result depends on
      # a clone depth another does not share. Cost: 9.89 MiB over 1800 commits (M48
      # Increment 11).
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # The runner's CPU count, read back by this step's name: M54 Increment 8's
      # before run was, and the after runs are.
      - name: CPU count
        run: nproc

      # The branch model's name rule (CLAUDE.md -> Branches): a push to, or a pull
      # request from, a branch outside the closed set fails here, in seconds, with the
      # allowed patterns listed. A pull request is checked by its head branch; a tag
      # push has no branch and is not checked; and a pull request from a fork (its head
      # repository is not this one, or null once the fork is deleted) is exempt, because
      # its branch is the contributor's to name — the rest of this job runs on it
      # unchanged, and a push is always checked. The rule is dev/branch-name, and
      # crates/cli/tests/branch_name_fence.rs holds it to jigc's slug grammar and
      # drives this body for each event.
      - name: branch name
        env:
          BRANCH_EVENT: ${{ github.event_name }}
          BRANCH_REF_TYPE: ${{ github.ref_type }}
          BRANCH_REF_NAME: ${{ github.ref_name }}
          BRANCH_HEAD_REF: ${{ github.head_ref }}
          BRANCH_REPO: ${{ github.repository }}
          BRANCH_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$BRANCH_EVENT" = pull_request ] && [ "$BRANCH_HEAD_REPO" != "$BRANCH_REPO" ]; then
            echo "branch name: a pull request from the fork ${BRANCH_HEAD_REPO:-(deleted)}, exempt: its branch is its contributor's to name"
            exit 0
          elif [ "$BRANCH_EVENT" = pull_request ]; then
            branch="$BRANCH_HEAD_REF"
          elif [ "$BRANCH_REF_TYPE" = branch ]; then
            branch="$BRANCH_REF_NAME"
          else
            echo "branch name: a $BRANCH_EVENT on a ${BRANCH_REF_TYPE:-non-branch} ref, no branch to check"
            exit 0
          fi
          echo "branch name: $branch"
          dev/branch-name "$branch"

      # The public-hygiene guard (implementation/public-hygiene.md), its own job beside
      # the cargo jobs, so a leak fails in seconds rather than after the test run. Both
      # scans read the PUSHED RANGE, computed once here: a push's `before..HEAD`, a pull
      # request's `base..HEAD`, and the whole history when there is no usable base (a
      # branch's first push reports an all-zero `before`; a force-push's `before` may be
      # gone).
      - name: hygiene range
        env:
          HYGIENE_EVENT: ${{ github.event_name }}
          HYGIENE_BEFORE: ${{ github.event.before }}
          HYGIENE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$HYGIENE_EVENT" = pull_request ] && git cat-file -e "$HYGIENE_BASE^{commit}" 2>/dev/null; then
            range="$HYGIENE_BASE..HEAD"
          elif [ -n "$HYGIENE_BEFORE" ] && git cat-file -e "$HYGIENE_BEFORE^{commit}" 2>/dev/null; then
            range="$HYGIENE_BEFORE..HEAD"
          else
            range="HEAD"
          fi
          echo "hygiene range: $range"
          echo "HYGIENE_RANGE=$range" >> "$GITHUB_ENV"

      # gitleaks, pinned, verified against the release's own checksum list, and run with
      # --redact so a finding never prints the value it found. `.gitleaks.toml` at the
      # repo root is picked up automatically and allowlists the one known false positive.
      # --text --no-textconv --no-ext-diff: git prints a binary file's lines, and a file
      # an attribute of the checkout marks binary or converts, as text, so no line hides
      # (dev/hygiene-scan reads them the same way).
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--text --no-textconv --no-ext-diff $HYGIENE_RANGE" .

      # The denylist: private terms (names, hosts, ticket keys) that gitleaks has no rule
      # for. The list itself is the JIGC_DENYLIST secret and never a repo file, because a
      # committed denylist is the leak. Hits are reported by commit, path and line only.
      # The same scan holds the range to its built-in rules -- no host path on an added
      # line, no session or agent id on one or in a message -- whose patterns are in
      # dev/hygiene-scan and no secret (implementation/public-hygiene.md, rule 6). Unset
      # (a fork's pull request has no secrets), the step says the denylist did not run
      # rather than passing silently, and runs the built-in rules alone.
      - name: denylist
        env:
          JIGC_DENYLIST: ${{ secrets.JIGC_DENYLIST }}
        run: |
          if [ -z "$JIGC_DENYLIST" ]; then
            echo "::notice title=denylist skipped::the JIGC_DENYLIST secret is not set, so the denylist scan did not run; the host-path and id scan runs alone"
            dev/hygiene-scan --no-denylist "$HYGIENE_RANGE"
            exit
          fi
          list=$(mktemp)
          printf '%s\n' "$JIGC_DENYLIST" > "$list"
          dev/hygiene-scan "$list" "$HYGIENE_RANGE"

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: CPU count
        run: nproc

      # rustup honors ./rust-toolchain.toml (channel 1.95.0 + rustfmt, clippy),
      # so the pinned stable toolchain installs on first cargo invocation.
      - name: Show toolchain
        run: cargo --version && rustc --version

      # One cargo workspace, one target dir: the `doc-code` probe is part of `jigc`.
      # The cache key already carries the job id; a matrix row adds its group.
      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: CPU count
        run: nproc

      - name: Show toolchain
        run: cargo --version && rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: CPU count
        run: nproc

      - name: Show toolchain
        run: cargo --version && rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      - name: cargo build
        run: cargo build

  test:
    # `test (g_flow)` for a group that runs whole, `test (g_tooling, record)` for a part.
    name: test (${{ matrix.group }}${{ matrix.part && format(', {0}', matrix.part) || '' }})
    runs-on: ubuntu-latest
    # A part's own bound; ten minutes for a row that names none.
    timeout-minutes: ${{ matrix.minutes || 10 }}
    strategy:
      fail-fast: false
      matrix:
        # Exactly the `[[test]]` targets of crates/cli/Cargo.toml, this list and the
        # groups of `include` together — fenced to `cargo metadata` by
        # tooling-tests/ci_matrix_fence.rs.
        group:
          - g_flow
          - g_migrate
          - g_finalize
          - g_item
          - g_compose
          - g_config
          - g_milestone
          - g_methodology
          - g_doc
          - g_solo_store_sweep
          - g_solo_trial_corpus
        # Two groups run in parts. `g_tooling` was cancelled at ten minutes on every push
        # from 2026-10-07 to 2026-10-12 (DECISIONS.md -> 2026-10-12, *The tooling leg runs in
        # three parts*), and by 2026-11-06 its three parts each ran past 80 % of their
        # bounds; `g_migration`, which peaked at 71 % of its ten minutes, runs in parts
        # because the plan before the stabilization run's opening splits it, its task U0
        # (completions/artifacts/M55/stabilization-build/pre-opening-plan/detail.md;
        # DECISIONS.md -> 2026-11-06, *CI's legs re-bounded*). A group
        # stays one target — a target per part is a test binary more for every local gate to
        # link — so a part is the group's row with libtest's own arguments behind it: the
        # heaviest suites are a part each, by name, and the group's last part is every test
        # of none of them, so a suite added to the group runs there without a line here.
        # `proxy` is the seconds the part's exact argv took cold in
        # `dev/runner-faithful --cpus 4`, and `minutes` is the header's rule over it, which
        # tooling-tests/ci_matrix_fence.rs arm (j) holds. A group in parts is NOT in the
        # list above: an `include` row whose group the list names is added to that row
        # instead of making one, and the group would run as its last part alone.
        include:
          - group: g_tooling
            part: record
            tests: "-- dev_stabilize_record::"
            proxy: 365
            minutes: 19
          - group: g_tooling
            part: simulation
            tests: "-- stabilize_simulation::"
            proxy: 421
            minutes: 22
          - group: g_tooling
            part: step
            tests: "-- dev_stabilize_step::"
            proxy: 240
            minutes: 12
          - group: g_tooling
            part: rest
            tests: "-- --skip dev_stabilize_record:: --skip stabilize_simulation:: --skip dev_stabilize_step::"
            proxy: 138
            minutes: 10
          - group: g_migration
            part: route_catalog
            tests: "-- route_catalog::"
            proxy: 149
            minutes: 10
          - group: g_migration
            part: byte_table
            tests: "-- byte_table::"
            proxy: 169
            minutes: 10
          - group: g_migration
            part: rest
            tests: "-- --skip route_catalog:: --skip byte_table::"
            proxy: 72
            minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: CPU count
        run: nproc

      - name: Show toolchain
        run: cargo --version && rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.group }}
          workspaces: |
            . -> target

      # `matrix.tests` is empty for a group that runs whole.
      - name: cargo test --test ${{ matrix.group }}
        run: cargo test -p jigc --test ${{ matrix.group }} --no-fail-fast ${{ matrix.tests }}

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: CPU count
        run: nproc

      - name: Show toolchain
        run: cargo --version && rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      - name: cargo test --workspace --lib --bins
        run: cargo test --workspace --lib --bins --no-fail-fast

      - name: cargo test --workspace --doc
        run: cargo test --workspace --doc --no-fail-fast

  manifest-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: CPU count
        run: nproc

      - name: Show toolchain
        run: cargo --version && rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      # The manifest-freeze fence (M48 Increment 11): a frozen `schema-hash` may move
      # only together with its co-located version field. CI-ONLY, and the arm is
      # `#[ignore]`d for that reason — the escape is a commit-message trailer
      # (`Manifest-Repin: <entity>`), and the local four-command gate runs before the
      # message exists, so a fence riding it could never be made green for a legitimate
      # re-pin. `--ignored --exact` un-skips exactly this arm; every rule it is built
      # out of stays in the `test` job's `g_finalize` row.
      #
      # The event context is forwarded RAW and chosen among in Rust: the ladder
      # (push -> github.event.before, PR -> the base sha, everything else and every
      # unusable value -> the HEAD~1 floor) is a tested function, and a `${{ … || … }}`
      # here would put it back where nothing tests it.
      - name: manifest-freeze fence
        env:
          FENCE_EVENT_NAME: ${{ github.event_name }}
          FENCE_PUSH_BEFORE: ${{ github.event.before }}
          FENCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: cargo test -p jigc --test g_finalize manifest_freeze_fence::live -- --ignored --exact

  publish-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: CPU count
        run: nproc

      - name: Show toolchain
        run: cargo --version && rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      - name: cargo publish --workspace --dry-run
        run: cargo publish --workspace --dry-run

  lock-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: CPU count
        run: nproc

      - name: Show toolchain
        run: cargo --version && rustc --version

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target

      # Online and never `--no-deps`: without resolution there is no lock to be stale
      # against, so a manifest pin `--locked` refuses exits 0 under `--no-deps`
      # (DECISIONS.md -> M54 Increment 8 planning).
      - name: cargo metadata --locked
        run: cargo metadata --locked --format-version 1 > /dev/null

  # The one aggregate, and the only check `main`'s ruleset requires
  # (implementation/release.md -> The main branch). It `needs` every other job and runs
  # `if: always()`, so it reports even when a leg fails, and it is green only when
  # every needed job's result is `success`: a failure, a cancellation and a skip all
  # turn it red. No checkout and no cargo: it reads the `needs` context and nothing
  # else. tooling-tests/ci_matrix_fence.rs holds `needs` to every other job and runs
  # this body over each result.
  ci-ok:
    needs:
      - hygiene
      - fmt
      - clippy
      - build
      - test
      - unit
      - manifest-freeze
      - publish-dry-run
      - lock-current
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: every job succeeded
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          total=$(printf '%s' "$CI_NEEDS" | jq 'length')
          if [ "$total" -eq 0 ]; then
            echo "ci-ok: the needs context is empty, so nothing was checked"
            exit 1
          fi
          failed=$(printf '%s' "$CI_NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "  \(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "ci-ok: not every job succeeded:"
            printf '%s\n' "$failed"
            exit 1
          fi
          echo "ci-ok: all $total jobs succeeded"
