name: Feature request
description: A capability jigc should have, or a surface that should behave differently.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: >
        What you were trying to do and where jigc got in the way or fell short.
        A concrete session that hit the gap beats an abstract wish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed surface
      description: >
        If you have a shape in mind — a verb, a flag, a doctype, a workflow step —
        sketch it. Leave blank if you only have the problem.
    validations:
      required: false
  - type: textarea
    id: boundary
    attributes:
      label: Determinism-boundary check
      description: >
        jigc's one load-bearing rule: the CLI owns structure (which docs exist,
        placement, ordering, cross-references, validation), the LLM owns only the
        prose inside slots. One line on which side of that line your request lives —
        requests that need the CLI to interpret prose are usually out of scope.
    validations:
      required: false
